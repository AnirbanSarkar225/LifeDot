<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFEDOT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #fff;
      overflow-x: hidden;
      cursor: none;
    }
    
    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(0, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), 0 0 50px rgba(0, 255, 255, 0.4);
      mix-blend-mode: screen;
    }
    
    .cursor-ring {
      position: fixed;
      width: 35px;
      height: 35px;
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      mix-blend-mode: screen;
    }
    
    .cursor-ring.hover {
      width: 65px;
      height: 65px;
      border-color: rgba(0, 255, 255, 0.9);
    }
    
    /* 3D CANVAS */
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* NAVIGATION */
    nav {
      position: fixed;
      top: 35px;
      right: 60px;
      z-index: 100;
      display: flex;
      gap: 25px;
    }
    
    .nav-pill {
      padding: 14px 40px;
      background: rgba(15, 25, 45, 0.7);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 35px;
      font-size: 11px;
      letter-spacing: 3px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.9);
      transition: all 0.4s ease;
      backdrop-filter: blur(15px);
      font-weight: 400;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .nav-pill:hover {
      background: rgba(0, 255, 255, 0.15);
      border-color: rgba(0, 255, 255, 0.8);
      color: #fff;
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
      transform: translateY(-2px);
    }
    
    .logo {
      position: fixed;
      top: 45px;
      left: 60px;
      z-index: 100;
      font-size: 14px;
      letter-spacing: 6px;
      font-weight: 400;
      opacity: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }
    
    /* CONTENT */
    .content {
      position: relative;
      z-index: 1;
    }
    
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .hero-text {
      max-width: 1000px;
      padding: 0 50px;
      animation: fadeIn 1.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .hero h1 {
      font-size: clamp(70px, 13vw, 160px);
      font-weight: 300;
      line-height: 0.88;
      letter-spacing: -4px;
      margin-bottom: 50px;
      text-shadow: 0 0 80px rgba(0, 255, 255, 0.4);
      background: linear-gradient(180deg, #fff 0%, rgba(0, 255, 255, 0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .hero p {
      font-size: 13px;
      line-height: 2.2;
      letter-spacing: 4px;
      opacity: 0.7;
      max-width: 750px;
      margin: 0 auto 70px;
      font-weight: 300;
      color: rgba(0, 255, 255, 0.8);
    }
    
    .cta-buttons {
      display: flex;
      gap: 25px;
      justify-content: center;
    }
    
    .btn {
      padding: 20px 55px;
      font-size: 11px;
      letter-spacing: 3px;
      border: none;
      background: none;
      color: #fff;
      text-decoration: none;
      cursor: none;
      font-weight: 300;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
    }
    
    .btn-primary {
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 35px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }
    
    .btn-primary:hover {
      background: rgba(0, 255, 255, 0.3);
      border-color: rgba(0, 255, 255, 0.9);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
      transform: translateY(-3px);
    }
    
    .btn-secondary {
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 35px;
      backdrop-filter: blur(15px);
    }
    
    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-3px);
    }
    
    /* SPINE SCROLL SECTION */
    .spine-section {
      min-height: 300vh;
      position: relative;
      padding: 150px 0;
    }
    
    .spine-container {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 3D SPINE */
    .spine-3d {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #spineCanvas {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    /* CARDS */
    .cards-wrapper {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .feature-card {
      position: absolute;
      width: 380px;
      background: rgba(15, 25, 45, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 25px;
      padding: 45px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
      transition: all 0.5s ease;
      pointer-events: all;
    }
    
    .feature-card:hover {
      border-color: rgba(0, 255, 255, 0.6);
      box-shadow: 0 15px 70px rgba(0, 255, 255, 0.3);
      transform: scale(1.05);
    }
    
    .card-num {
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.4;
      margin-bottom: 25px;
      font-weight: 300;
      color: rgba(0, 255, 255, 0.8);
    }
    
    .card-icon {
      width: 70px;
      height: 70px;
      background: rgba(0, 255, 255, 0.12);
      border: 1px solid rgba(0, 255, 255, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      font-size: 28px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
    }
    
    .feature-card h3 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }
    
    .feature-card p {
      font-size: 14px;
      line-height: 1.9;
      opacity: 0.65;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.85);
    }
    
    /* SECTION HEADER */
    .section-header {
      text-align: center;
      margin-bottom: 100px;
      position: relative;
      z-index: 10;
    }
    
    .section-subtitle {
      font-size: 12px;
      letter-spacing: 5px;
      opacity: 0.5;
      margin-bottom: 25px;
      font-weight: 300;
      text-transform: uppercase;
      color: rgba(0, 255, 255, 0.9);
    }
    
    .section-title {
      font-size: clamp(55px, 9vw, 110px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -3px;
      max-width: 1000px;
      margin: 0 auto;
      background: linear-gradient(180deg, #fff 0%, rgba(0, 255, 255, 0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* FOOTER */
    footer {
      padding: 120px 60px 60px;
      text-align: center;
      border-top: 1px solid rgba(0, 255, 255, 0.08);
      position: relative;
      z-index: 10;
    }
    
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto 60px;
    }
    
    .footer-links {
      display: flex;
      gap: 45px;
    }
    
    .footer-links a {
      font-size: 11px;
      color: #fff;
      text-decoration: none;
      opacity: 0.5;
      transition: opacity 0.3s;
      letter-spacing: 3px;
      font-weight: 300;
    }
    
    .footer-links a:hover {
      opacity: 1;
    }
    
    .footer-bottom {
      font-size: 10px;
      opacity: 0.25;
      letter-spacing: 3px;
      font-weight: 300;
    }
    
    /* RESPONSIVE */
    @media (max-width: 1024px) {
      nav { right: 30px; }
      .logo { left: 30px; }
      .feature-card { width: 320px; padding: 35px; }
    }
    
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
      nav { flex-direction: column; top: 20px; right: 20px; }
      .logo { left: 20px; top: 30px; }
      .feature-card { width: 90%; max-width: 350px; }
      .cta-buttons { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <!-- Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  
  <!-- 3D Canvas -->
  <canvas id="canvas3d"></canvas>
  
  <!-- Logo -->
  <div class="logo">LIFEDOT</div>
  
  <!-- Navigation -->
  <nav>
    <a href="login.html" class="nav-pill">LOGIN</a>
    <a href="register.html" class="nav-pill">START</a>
  </nav>
  
  <!-- Content -->
  <div class="content">
    <!-- Hero -->
    <section class="hero">
      <div class="hero-text">
        <h1>YOUR HEALTH<br>MONITORED</h1>
        <p>REAL-TIME MONITORING · EMERGENCY ALERTS · SECURE RECORDS</p>
        <div class="cta-buttons">
          <a href="register.html" class="btn btn-primary">GET STARTED</a>
          <a href="flowchart.html" class="btn btn-secondary">VIEW WORKFLOW</a>
        </div>
      </div>
    </section>
    
    <!-- Spine Scroll Section -->
    <section class="spine-section">
      <div class="section-header">
        <div class="section-subtitle">FEATURES</div>
        <h2 class="section-title">Advanced Health<br>Monitoring</h2>
      </div>
      
      <div class="spine-container">
        <div class="spine-3d">
          <canvas id="spineCanvas"></canvas>
        </div>
        
        <div class="cards-wrapper" id="cardsWrapper">
          <!-- Cards will be positioned by JS -->
        </div>
      </div>
    </section>
  </div>
  
  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <div class="logo">LIFEDOT</div>
      <div class="footer-links">
        <a href="flowchart.html">WORKFLOW</a>
        <a href="login.html">LOGIN</a>
        <a href="register.html">REGISTER</a>
      </div>
    </div>
    <div class="footer-bottom">
      © 2026 LIFEDOT · ALL RIGHTS RESERVED
    </div>
  </footer>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursorRing');
    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();
    
    // Hover effects
    document.querySelectorAll('a, button, .feature-card').forEach(el => {
      el.addEventListener('mouseenter', () => cursorRing.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursorRing.classList.remove('hover'));
    });
    
    // Three.js Background Scene
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.04);
    camera.position.set(0, 5, 15);
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 3500;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 60;
      posArray[i + 1] = (Math.random() - 0.5) * 60;
      posArray[i + 2] = (Math.random() - 0.5) * 60;
      
      const colorChoice = Math.random();
      if (colorChoice < 0.4) {
        colorArray[i] = 0;
        colorArray[i + 1] = 1;
        colorArray[i + 2] = 1;
      } else if (colorChoice < 0.7) {
        colorArray[i] = 0.4;
        colorArray[i + 1] = 0;
        colorArray[i + 2] = 1;
      } else {
        colorArray[i] = 0;
        colorArray[i + 1] = 0.5;
        colorArray[i + 2] = 1;
      }
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0x0a2e4a, 0.6);
    scene.add(ambientLight);
    
    const pointLight1 = new THREE.PointLight(0x00ffff, 1.2, 100);
    pointLight1.position.set(12, 12, 12);
    scene.add(pointLight1);
    
    const pointLight2 = new THREE.PointLight(0x0066ff, 1, 100);
    pointLight2.position.set(-12, -12, -12);
    scene.add(pointLight2);
    
    // Mouse movement
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    // Scroll
    let scrollY = 0;
    window.addEventListener('scroll', () => {
      scrollY = window.scrollY;
    });
    
    // Background Animation
    function animateBackground() {
      requestAnimationFrame(animateBackground);
      
      particlesMesh.rotation.y += 0.0006;
      particlesMesh.rotation.x += 0.0003;
      
      camera.position.x += (targetX * 2.5 - camera.position.x) * 0.05;
      camera.position.y += (targetY * 2.5 - camera.position.y + 5) * 0.05;
      camera.position.z = 15 - scrollY * 0.004;
      
      renderer.render(scene, camera);
    }
    animateBackground();
    
    // Spine Canvas Setup
    const spineCanvas = document.getElementById('spineCanvas');
    const spineScene = new THREE.Scene();
    const spineCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const spineRenderer = new THREE.WebGLRenderer({ canvas: spineCanvas, alpha: true, antialias: true });
    spineRenderer.setSize(window.innerWidth, window.innerHeight);
    spineRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    spineCamera.position.set(0, 0, 8);
    
    // Create Spine Structure
    const spineGroup = new THREE.Group();
    const vertebrae = 12;
    
    for (let i = 0; i < vertebrae; i++) {
      const geometry = new THREE.TorusGeometry(0.3, 0.08, 16, 100);
      const material = new THREE.MeshPhongMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 0.3,
        transparent: true,
        opacity: 0.6,
        wireframe: false
      });
      const torus = new THREE.Mesh(geometry, material);
      torus.position.y = (i - vertebrae / 2) * 0.8;
      torus.rotation.x = Math.PI / 2;
      spineGroup.add(torus);
      
      // Connecting line
      if (i < vertebrae - 1) {
        const lineGeometry = new THREE.CylinderGeometry(0.04, 0.04, 0.8, 8);
        const lineMaterial = new THREE.MeshPhongMaterial({
          color: 0x00ffff,
          emissive: 0x00ffff,
          emissiveIntensity: 0.2,
          transparent: true,
          opacity: 0.4
        });
        const line = new THREE.Mesh(lineGeometry, lineMaterial);
        line.position.y = (i - vertebrae / 2) * 0.8 + 0.4;
        spineGroup.add(line);
      }
    }
    
    spineScene.add(spineGroup);
    
    // Spine Lights
    const spineAmbient = new THREE.AmbientLight(0x0a2e4a, 0.5);
    spineScene.add(spineAmbient);
    
    const spineLight = new THREE.PointLight(0x00ffff, 1.5, 50);
    spineLight.position.set(5, 0, 5);
    spineScene.add(spineLight);
    
    // Cards Data
    const cardsData = [
      { icon: '💓', title: 'Real-Time Monitoring', desc: 'Track your heart rate 24/7 with instant updates and intelligent anomaly detection powered by advanced sensors.' },
      { icon: '🚨', title: 'Emergency Alerts', desc: 'Automatic notifications to emergency contacts when critical conditions are detected, ensuring rapid response.' },
      { icon: '📊', title: 'Medical Records', desc: 'Securely store and manage all medical reports in one encrypted location with easy access anytime.' },
      { icon: '🧠', title: 'AI Analysis', desc: 'Machine learning algorithms analyze your health patterns to provide predictive insights and recommendations.' },
      { icon: '📱', title: 'Multi-Platform', desc: 'Access your health data anywhere, on any device, with seamless synchronization across all platforms.' },
      { icon: '🔒', title: 'Privacy First', desc: 'End-to-end encryption ensures your sensitive health data remains completely private and secure.' }
    ];
    
    // Create Cards
    const cardsWrapper = document.getElementById('cardsWrapper');
    cardsData.forEach((card, i) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'feature-card';
      cardEl.innerHTML = `
        <div class="card-num">${String(i + 1).padStart(2, '0')}</div>
        <div class="card-icon">${card.icon}</div>
        <h3>${card.title}</h3>
        <p>${card.desc}</p>
      `;
      cardsWrapper.appendChild(cardEl);
    });
    
    const cards = document.querySelectorAll('.feature-card');
    
    // Animate Spine and Cards
    function animateSpine() {
      requestAnimationFrame(animateSpine);
      
      const spineSection = document.querySelector('.spine-section');
      const rect = spineSection.getBoundingClientRect();
      const sectionHeight = spineSection.offsetHeight;
      const progress = Math.max(0, Math.min(1, -rect.top / (sectionHeight - window.innerHeight)));
      
      // Rotate spine
      spineGroup.rotation.y = progress * Math.PI * 2;
      
      // Position cards around spine
      cards.forEach((card, i) => {
        const angle = (i / cards.length) * Math.PI * 2 + progress * Math.PI * 2;
        const radius = 500;
        const x = Math.cos(angle) * radius + window.innerWidth / 2 - card.offsetWidth / 2;
        const y = Math.sin(angle) * 250 + window.innerHeight / 2 - card.offsetHeight / 2;
        
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        card.style.opacity = Math.max(0.3, 1 - Math.abs(Math.sin(angle)) * 0.7);
        card.style.transform = `scale(${0.85 + Math.cos(angle) * 0.15})`;
      });
      
      spineRenderer.render(spineScene, spineCamera);
    }
    animateSpine();
    
    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      spineCamera.aspect = window.innerWidth / window.innerHeight;
      spineCamera.updateProjectionMatrix();
      spineRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
