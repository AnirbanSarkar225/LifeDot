<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Monitor — LifeDot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow: hidden;
    }

    /* CURSOR */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(0, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
      mix-blend-mode: screen;
    }
    
    .cursor-ring {
      position: fixed;
      width: 35px;
      height: 35px;
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      mix-blend-mode: screen;
    }

    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 40px;
      left: 60px;
      padding: 14px 40px;
      background: rgba(15, 25, 45, 0.7);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 35px;
      font-size: 11px;
      letter-spacing: 3px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.9);
      transition: all 0.4s ease;
      backdrop-filter: blur(15px);
      font-weight: 400;
      z-index: 100;
      text-transform: uppercase;
    }

    .back-btn:hover {
      background: rgba(0, 255, 255, 0.15);
      border-color: rgba(0, 255, 255, 0.8);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
    }

    /* CONTAINER */
    .container {
      position: relative;
      z-index: 1;
      max-width: 850px;
      width: 100%;
      background: rgba(15, 25, 45, 0.5);
      border: 2px solid rgba(0, 255, 255, 0.3);
      padding: 80px 70px;
      text-align: center;
      border-radius: 30px;
      backdrop-filter: blur(25px);
      animation: slideIn 0.8s ease;
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 255, 255, 0.1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* HEADER */
    .header {
      margin-bottom: 60px;
    }

    .header h1 {
      font-size: clamp(38px, 6vw, 52px);
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 15px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff 0%, rgba(0, 255, 255, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: rgba(0, 255, 255, 0.7);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: 300;
    }

    /* BPM DISPLAY */
    .bpm-display {
      margin: 60px 0;
      padding: 60px 50px;
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.08), rgba(0, 150, 255, 0.08));
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 25px;
      position: relative;
      overflow: hidden;
    }

    .bpm-display::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
      animation: shimmer 4s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .bpm-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: rgba(0, 255, 255, 0.7);
      margin-bottom: 30px;
      font-weight: 300;
    }

    .bpm-value {
      font-size: clamp(80px, 15vw, 120px);
      font-weight: 200;
      color: rgba(0, 255, 255, 1);
      line-height: 1;
      letter-spacing: -5px;
      margin: 30px 0;
      text-shadow: 0 0 60px rgba(0, 255, 255, 0.6), 0 0 100px rgba(0, 255, 255, 0.3);
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .bpm-value.danger {
      color: #ff0064;
      text-shadow: 0 0 60px rgba(255, 0, 100, 0.7);
      animation: dangerPulse 1s ease infinite;
    }

    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .bpm-average {
      margin-top: 35px;
      padding-top: 30px;
      border-top: 1px solid rgba(0, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    .bpm-average span {
      display: block;
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      margin-top: 12px;
      letter-spacing: -0.5px;
    }

    /* STATUS INDICATOR */
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 18px 35px;
      background: rgba(0, 255, 255, 0.08);
      border: 1px solid rgba(0, 255, 255, 0.3);
      margin-bottom: 50px;
      font-weight: 400;
      color: rgba(0, 255, 255, 0.9);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-radius: 30px;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      background: rgba(0, 255, 255, 1);
      border-radius: 50%;
      animation: blink 2s infinite;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .status-indicator.danger {
      background: rgba(255, 0, 100, 0.08);
      border-color: rgba(255, 0, 100, 0.4);
      color: #ff0064;
    }

    .status-indicator.danger .status-dot {
      background: #ff0064;
      box-shadow: 0 0 25px rgba(255, 0, 100, 0.7);
    }

    /* BUTTONS */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      padding: 22px 40px;
      border: none;
      font-size: 12px;
      font-weight: 400;
      cursor: none;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-radius: 35px;
    }

    .btn-emergency {
      background: rgba(255, 0, 100, 0.2);
      color: #fff;
      border: 2px solid rgba(255, 0, 100, 0.5);
      box-shadow: 0 0 30px rgba(255, 0, 100, 0.2);
    }

    .btn-emergency:hover {
      background: rgba(255, 0, 100, 0.3);
      box-shadow: 0 0 50px rgba(255, 0, 100, 0.5);
      transform: translateY(-3px);
    }

    .btn-back-dash {
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .btn-back-dash:hover {
      border-color: rgba(0, 255, 255, 0.5);
      background: rgba(0, 255, 255, 0.05);
      transform: translateY(-3px);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(15px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: rgba(15, 25, 45, 0.7);
      padding: 65px 55px;
      border: 2px solid rgba(255, 0, 100, 0.3);
      text-align: center;
      max-width: 500px;
      width: 90%;
      animation: modalSlide 0.4s ease;
      border-radius: 30px;
      backdrop-filter: blur(25px);
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(-30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      font-size: 60px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 30px rgba(255, 0, 100, 0.5));
    }

    .modal-content h3 {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 18px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .modal-content p {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 45px;
      line-height: 1.8;
      font-size: 14px;
      font-weight: 300;
    }

    .modal-buttons {
      display: flex;
      gap: 18px;
    }

    .btn-modal {
      flex: 1;
      padding: 20px;
      border: none;
      font-weight: 400;
      cursor: none;
      transition: all 0.3s ease;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-radius: 30px;
    }

    .btn-cancel {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.25);
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .btn-confirm {
      background: rgba(255, 0, 100, 0.2);
      color: #fff;
      border: 2px solid rgba(255, 0, 100, 0.5);
    }

    .btn-confirm:hover {
      background: rgba(255, 0, 100, 0.3);
    }

    /* STATUS MESSAGE */
    .status-message {
      margin-top: 30px;
      padding: 20px;
      font-weight: 300;
      font-size: 12px;
      text-align: center;
      display: none;
      animation: slideDown 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-radius: 25px;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-message.success {
      background: rgba(0, 255, 255, 0.2);
      color: #fff;
      border: 2px solid rgba(0, 255, 255, 0.5);
    }

    .status-message.error {
      background: rgba(255, 0, 100, 0.2);
      color: #ff0064;
      border: 2px solid rgba(255, 0, 100, 0.5);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
      .container { padding: 60px 45px; }
      .bpm-display { padding: 50px 35px; }
      .back-btn { top: 20px; left: 20px; }
      .button-group { gap: 15px; }
      .modal-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  
  <canvas id="canvas3d"></canvas>

  <a href="home.html" class="back-btn">← Back</a>

  <div class="container">
    <div class="header">
      <h1>Heart Monitor</h1>
      <p>Real-time cardiac tracking</p>
    </div>

    <div class="bpm-display">
      <div class="bpm-label">Current Heart Rate</div>
      <div id="bpmValue" class="bpm-value">--</div>
      <div class="bpm-average">
        Average Today
        <span id="avgBpm">-- BPM</span>
      </div>
    </div>

    <div class="status-indicator" id="statusIndicator">
      <span class="status-dot"></span>
      <span>Heart rate normal</span>
    </div>

    <div class="button-group">
      <button class="btn btn-emergency" onclick="openModal()">
        🚨 Send Emergency Alert
      </button>
      <button class="btn btn-back-dash" onclick="window.location.href='home.html'">
        ← Back to Dashboard
      </button>
    </div>

    <div id="statusMsg" class="status-message"></div>
  </div>

  <div id="alertModal" class="modal">
    <div class="modal-content">
      <div class="modal-icon">🚨</div>
      <h3>Send Alert?</h3>
      <p>This will notify all your emergency contacts immediately.</p>
      <div class="modal-buttons">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-confirm" onclick="sendEmergency()">Send Alert</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cursor
    const cursor = document.querySelector('.cursor');
    const cursorRing = document.querySelector('.cursor-ring');
    let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // Three.js
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.set(0, 5, 15);
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.04);
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2500;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 60;
      posArray[i + 1] = (Math.random() - 0.5) * 60;
      posArray[i + 2] = (Math.random() - 0.5) * 60;
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() < 0.5 ? 1 : 0.5;
      colorArray[i + 2] = 1;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    }));
    scene.add(particlesMesh);
    
    const ambientLight = new THREE.AmbientLight(0x0a2e4a, 0.6);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0x00ffff, 1.2, 100);
    pointLight.position.set(12, 12, 12);
    scene.add(pointLight);
    
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.y += 0.0006;
      camera.position.x += (targetX * 2.5 - camera.position.x) * 0.05;
      camera.position.y += (targetY * 2.5 - camera.position.y + 5) * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    // BPM Monitoring
    const bpmValue = document.getElementById("bpmValue");
    const avgBpm = document.getElementById("avgBpm");
    const statusMsg = document.getElementById("statusMsg");
    const statusIndicator = document.getElementById("statusIndicator");
    const modal = document.getElementById("alertModal");
    let autoAlertSent = false;

    async function fetchBpm() {
      try {
        const res = await fetch("https://lifedot.onrender.com/bpm");
        const data = await res.json();
        
        bpmValue.textContent = data.bpm;
        avgBpm.textContent = `${data.avg_bpm} BPM`;

        if (data.bpm <= 40 || data.bpm >= 150) {
          bpmValue.classList.add("danger");
          statusIndicator.classList.add("danger");
          statusIndicator.innerHTML = '<span class="status-dot"></span><span>⚠️ Critical heart rate!</span>';
          
          if (!autoAlertSent) {
            autoEmergency();
          }
        } else {
          bpmValue.classList.remove("danger");
          statusIndicator.classList.remove("danger");
          statusIndicator.innerHTML = '<span class="status-dot"></span><span>Heart rate normal</span>';
          autoAlertSent = false;
        }
      } catch (error) {
        bpmValue.textContent = "--";
        avgBpm.textContent = "-- BPM";
      }
    }

    function openModal() {
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    window.onclick = (event) => {
      if (event.target === modal) closeModal();
    };

    async function sendEmergency() {
      closeModal();
      showStatus("Sending emergency alert...", "");
      
      try {
        const res = await fetch("https://lifedot.onrender.com/emergency", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          showStatus("✅ Emergency alert sent!", "success");
        } else {
          showStatus("❌ Failed to send alert.", "error");
        }
      } catch (error) {
        showStatus("⚠️ Unable to connect.", "error");
      }
    }

    async function autoEmergency() {
      if (autoAlertSent) return;
      autoAlertSent = true;

      showStatus("⚠️ Critical BPM! Sending automatic alert...", "");

      try {
        const res = await fetch("https://lifedot.onrender.com/emergency", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          showStatus("✅ Automatic alert sent!", "success");
        } else {
          showStatus("❌ Failed to send automatic alert.", "error");
        }
      } catch (error) {
        showStatus("⚠️ Unable to connect.", "error");
      }
    }

    function showStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className = `status-message ${type}`;
      statusMsg.style.display = "block";

      if (type) {
        setTimeout(() => statusMsg.style.display = "none", 5000);
      }
    }

    setInterval(fetchBpm, 3000);
    fetchBpm();
  </script>
</body>
</html>
