<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeDot | Heart Rate Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #1a202c;
    }

    .main-card {
      background: white;
      border-radius: 30px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.6s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .heart-icon {
      color: #f5576c;
      font-size: 2.5rem;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      25% {
        transform: scale(1.2);
      }
      50% {
        transform: scale(1);
      }
    }

    .subtitle {
      color: #718096;
      font-size: 0.95rem;
    }

    /* BPM Display */
    .bpm-container {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 25px;
      padding: 2.5rem;
      text-align: center;
      margin-bottom: 2rem;
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
    }

    .bpm-value {
      font-size: 4.5rem;
      font-weight: 800;
      color: white;
      margin: 0.5rem 0;
      transition: all 0.3s ease;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .bpm-value.danger {
      color: #fed7d7;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .bpm-label {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .bpm-average {
      color: rgba(255, 255, 255, 0.8);
      margin-top: 1rem;
      font-size: 0.95rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .bpm-average strong {
      font-size: 1.4rem;
      color: white;
      display: block;
      margin-top: 0.25rem;
    }

    /* Status Indicator */
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #c6f6d5;
      border-radius: 12px;
      margin-bottom: 2rem;
      font-weight: 600;
      color: #22543d;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #38a169;
      border-radius: 50%;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    .status-indicator.danger {
      background: #fed7d7;
      color: #742a2a;
    }

    .status-indicator.danger .status-dot {
      background: #e53e3e;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      padding: 1.1rem 1.5rem;
      border: none;
      border-radius: 15px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-emergency {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
    }

    .btn-emergency:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(245, 87, 108, 0.4);
    }

    .btn-back {
      background: #f7fafc;
      color: #2d3748;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .btn-back:hover {
      background: #edf2f7;
      transform: translateY(-2px);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .modal-content {
      background: white;
      padding: 2.5rem;
      border-radius: 25px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
    }

    .modal-content h3 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #1a202c;
    }

    .modal-content p {
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .modal-buttons {
      display: flex;
      gap: 1rem;
    }

    .btn-modal {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-cancel {
      background: #edf2f7;
      color: #2d3748;
    }

    .btn-cancel:hover {
      background: #e2e8f0;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
    }

    .btn-confirm:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    }

    /* Status Message */
    .status-message {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      display: none;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-message.success {
      background: #c6f6d5;
      color: #22543d;
      border: 2px solid #9ae6b4;
    }

    .status-message.error {
      background: #fed7d7;
      color: #742a2a;
      border: 2px solid #fc8181;
    }

    @media (max-width: 600px) {
      .main-card {
        padding: 2rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .bpm-value {
        font-size: 3.5rem;
      }

      .btn {
        padding: 1rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="main-card">
    <div class="header">
      <h1>
        <span class="heart-icon">❤️</span>
        Heart Monitor
      </h1>
      <p class="subtitle">Real-time heart rate tracking</p>
    </div>

    <div class="bpm-container">
      <div class="bpm-label">CURRENT BPM</div>
      <div id="bpmValue" class="bpm-value">--</div>
      <div class="bpm-average">
        Average Today
        <strong id="avgBpm">-- BPM</strong>
      </div>
    </div>

    <div class="status-indicator" id="statusIndicator">
      <span class="status-dot"></span>
      <span>Heart rate normal</span>
    </div>

    <div class="button-group">
      <button class="btn btn-emergency" onclick="openModal()">
        🚨 Send Emergency Alert
      </button>
      <button class="btn btn-back" onclick="window.location.href='home.html'">
        ← Back to Dashboard
      </button>
    </div>

    <div id="statusMsg" class="status-message"></div>
  </div>
  <div id="alertModal" class="modal">
    <div class="modal-content">
      <div class="modal-icon">🚨</div>
      <h3>Send Emergency Alert?</h3>
      <p>This will immediately notify all your emergency contacts about a potential health issue.</p>
      <div class="modal-buttons">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-confirm" onclick="sendEmergency()">Send Alert</button>
      </div>
    </div>
  </div>

  <script>
    const bpmValue = document.getElementById("bpmValue");
    const avgBpm = document.getElementById("avgBpm");
    const statusMsg = document.getElementById("statusMsg");
    const statusIndicator = document.getElementById("statusIndicator");
    const modal = document.getElementById("alertModal");
    let autoAlertSent = false;

    async function fetchBpm() {
      try {
        const res = await fetch("http://127.0.0.1:8000/bpm");
        const data = await res.json();
        
        bpmValue.textContent = data.bpm;
        avgBpm.textContent = `${data.avg_bpm} BPM`;

        // Check for critical BPM
        if (data.bpm <= 40 || data.bpm >= 150) {
          bpmValue.classList.add("danger");
          statusIndicator.classList.add("danger");
          statusIndicator.innerHTML = '<span class="status-dot"></span><span>⚠️ Critical heart rate detected!</span>';
          
          if (!autoAlertSent) {
            autoEmergency();
          }
        } else {
          bpmValue.classList.remove("danger");
          statusIndicator.classList.remove("danger");
          statusIndicator.innerHTML = '<span class="status-dot"></span><span>Heart rate normal</span>';
          autoAlertSent = false;
        }
      } catch (error) {
        bpmValue.textContent = "--";
        avgBpm.textContent = "-- BPM";
        console.error("Failed to fetch BPM:", error);
      }
    }

    function openModal() {
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    window.onclick = (event) => {
      if (event.target === modal) {
        closeModal();
      }
    };

    async function sendEmergency() {
      closeModal();
      showStatus("📤 Sending emergency alert...", "");
      
      try {
        const res = await fetch("http://127.0.0.1:8000/emergency", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          showStatus("✅ Emergency alert sent successfully!", "success");
        } else {
          showStatus("❌ Failed to send emergency alert.", "error");
        }
      } catch (error) {
        showStatus("⚠️ Unable to connect to server.", "error");
      }
    }

    async function autoEmergency() {
      if (autoAlertSent) return;
      autoAlertSent = true;

      showStatus("⚠️ Critical BPM detected! Sending automatic alert...", "");

      try {
        const res = await fetch("http://127.0.0.1:8000/emergency", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          showStatus("✅ Automatic emergency alert sent to your contacts!", "success");
        } else {
          showStatus("❌ Failed to send automatic alert.", "error");
        }
      } catch (error) {
        showStatus("⚠️ Unable to connect to server.", "error");
      }
    }

    function showStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className = `status-message ${type}`;
      statusMsg.style.display = "block";

      if (type) {
        setTimeout(() => {
          statusMsg.style.display = "none";
        }, 5000);
      }
    }
    setInterval(fetchBpm, 3000);
    fetchBpm();
  </script>
</body>
</html>
