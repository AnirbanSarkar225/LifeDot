<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEART MONITOR — LIFEDOT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #fff;
      overflow: hidden;
      cursor: none;
      height: 100vh;
    }
    
    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.1s ease;
      mix-blend-mode: difference;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }
    
    /* 3D SCENE */
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 40px;
      left: 50px;
      padding: 12px 30px;
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid rgba(0, 255, 255, 0.6);
      color: #00ffff;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
      text-decoration: none;
      display: inline-block;
    }
    
    .back-btn:hover {
      background: rgba(0, 255, 255, 0.25);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
      transform: translateX(-5px);
    }
    
    /* MONITOR CONTAINER */
    .monitor-container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* PULSE RINGS */
    .pulse-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin-bottom: 50px;
    }
    
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border: 4px solid #00ffff;
      border-radius: 50%;
      opacity: 0;
      animation: pulseExpand 4s infinite;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.8),
                  inset 0 0 40px rgba(0, 255, 255, 0.3);
    }
    
    .pulse-ring:nth-child(2) {
      animation-delay: 1.3s;
    }
    
    .pulse-ring:nth-child(3) {
      animation-delay: 2.6s;
    }
    
    @keyframes pulseExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }
    
    /* BPM DISPLAY */
    .bpm-display {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .bpm-value {
      font-size: clamp(80px, 15vw, 140px);
      font-weight: 700;
      color: #00ffff;
      text-shadow: 0 0 60px rgba(0, 255, 255, 1),
                   0 0 120px rgba(0, 255, 255, 0.8),
                   0 0 180px rgba(0, 255, 255, 0.6);
      letter-spacing: -3px;
      margin-bottom: 15px;
      animation: glow 2s infinite;
    }
    
    @keyframes glow {
      0%, 100% {
        text-shadow: 0 0 60px rgba(0, 255, 255, 1),
                     0 0 120px rgba(0, 255, 255, 0.8),
                     0 0 180px rgba(0, 255, 255, 0.6);
      }
      50% {
        text-shadow: 0 0 80px rgba(0, 255, 255, 1),
                     0 0 160px rgba(0, 255, 255, 1),
                     0 0 240px rgba(0, 255, 255, 0.8);
      }
    }
    
    .bpm-value.danger {
      color: #ff0064;
      text-shadow: 0 0 60px rgba(255, 0, 100, 1),
                   0 0 120px rgba(255, 0, 100, 0.8),
                   0 0 180px rgba(255, 0, 100, 0.6);
      animation: dangerPulse 1s infinite;
    }
    
    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .bpm-label {
      font-size: 18px;
      letter-spacing: 5px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }
    
    /* STATUS */
    .status-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }
    
    .status-dot {
      width: 20px;
      height: 20px;
      background: #00ffff;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 255, 255, 1);
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .status-text {
      font-size: 15px;
      letter-spacing: 3px;
      color: #00ffff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    
    /* EMERGENCY BUTTON */
    .emergency-btn {
      padding: 18px 50px;
      background: linear-gradient(135deg, #ff0064, #ff3388);
      border: 3px solid #ff0064;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      box-shadow: 0 0 50px rgba(255, 0, 100, 0.6),
                  inset 0 0 20px rgba(255, 255, 255, 0.2);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 50px rgba(255, 0, 100, 0.6); }
      50% { box-shadow: 0 0 80px rgba(255, 0, 100, 1); }
    }
    
    .emergency-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 100px rgba(255, 0, 100, 1);
    }
    
    /* MODAL - Browser Alert Style */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: linear-gradient(135deg, #3a3f52, #2e3342);
      border: 1px solid #5a5f72;
      padding: 45px 55px;
      max-width: 520px;
      width: 90%;
      border-radius: 20px;
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.7);
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .modal-content h3 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 25px;
      color: #fff;
      letter-spacing: 0.3px;
      text-transform: none;
    }
    
    .modal-content p {
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 40px;
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      font-weight: 300;
    }
    
    .modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    .btn {
      padding: 14px 42px;
      font-size: 14px;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all 0.25s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      border-radius: 50px;
    }
    
    .btn-cancel {
      background: transparent;
      border: 2px solid #7080ff;
      color: #a0b0ff;
    }
    
    .btn-cancel:hover {
      background: rgba(100, 120, 255, 0.15);
      border-color: #8898ff;
    }
    
    .btn-confirm {
      background: #8896ff;
      color: #000;
      border: 2px solid transparent;
      font-weight: 500;
    }
    
    .btn-confirm:hover {
      background: #a0b0ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(136, 150, 255, 0.4);
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor { display: none; }
      .back-btn { left: 20px; top: 20px; }
      .pulse-container { width: 300px; height: 300px; }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  
  <!-- 3D Scene -->
  <canvas id="scene"></canvas>
  
  <!-- Back Button -->
  <a href="home.html" class="back-btn">← BACK TO DASHBOARD</a>
  
  <!-- Monitor Container -->
  <div class="monitor-container">
    <div class="pulse-container">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
    </div>
    
    <div class="bpm-display">
      <div class="bpm-value" id="bpmValue">--</div>
      <div class="bpm-label">BEATS PER MINUTE</div>
    </div>
    
    <div class="status-container">
      <div class="status-dot"></div>
      <div class="status-text" id="statusText">MONITORING ACTIVE</div>
    </div>
    
    <button class="emergency-btn" onclick="showEmergencyModal()">
      🚨 EMERGENCY ALERT
    </button>
  </div>
  
  <!-- Emergency Modal -->
  <div id="emergencyModal" class="modal">
    <div class="modal-content">
      <h3>lifedot-topaz.vercel.app says</h3>
      <p>Do you want to send emergency alert?</p>
      <div class="modal-buttons">
        <button class="btn btn-confirm" onclick="sendEmergency()">OK</button>
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Custom Cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    
    // Three.js Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    camera.position.z = 5;
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 15;
      posArray[i + 1] = (Math.random() - 0.5) * 15;
      posArray[i + 2] = (Math.random() - 0.5) * 15;
      
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() * 0.5 + 0.5;
      colorArray[i + 2] = Math.random() * 0.5 + 0.5;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.015,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      
      particlesMesh.rotation.x += 0.0003;
      particlesMesh.rotation.y += 0.0005;
      
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // BPM Monitoring
    const userId = localStorage.getItem("lifedot_user_id");
    const bpmValueEl = document.getElementById('bpmValue');
    const statusTextEl = document.getElementById('statusText');
    
    if (!userId) {
      console.warn('No user ID found');
      // Don't redirect for demo purposes
    }
    
    let lastEmergencyTime = 0;
    
    async function fetchBPM() {
      try {
        const res = await fetch('https://lifedot.onrender.com/bpm');
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const data = await res.json();
        console.log('BPM data received:', data);
        
        if (data.bpm !== undefined && data.bpm !== null) {
          const bpm = parseInt(data.bpm);
          bpmValueEl.textContent = bpm;
          
          // Check for danger levels
          if (bpm <= 40 || bpm >= 150) {
            bpmValueEl.classList.add('danger');
            statusTextEl.textContent = 'CRITICAL - DANGER ZONE';
            statusTextEl.style.color = '#ff0064';
            
            // Auto emergency after 5 seconds (only once per 30 seconds)
            const now = Date.now();
            if (now - lastEmergencyTime > 30000) {
              lastEmergencyTime = now;
              setTimeout(() => {
                if (bpmValueEl.classList.contains('danger')) {
                  autoEmergency(bpm);
                }
              }, 5000);
            }
          } else if (bpm < 60 || bpm > 100) {
            bpmValueEl.classList.remove('danger');
            statusTextEl.textContent = 'WARNING - ABNORMAL';
            statusTextEl.style.color = '#ffaa00';
          } else {
            bpmValueEl.classList.remove('danger');
            statusTextEl.textContent = 'NORMAL - HEALTHY';
            statusTextEl.style.color = '#00ffff';
          }
        } else {
          console.warn('BPM data invalid:', data);
          bpmValueEl.textContent = '--';
        }
      } catch (error) {
        console.error('BPM fetch error:', error);
        bpmValueEl.textContent = 'ERR';
        statusTextEl.textContent = 'CONNECTION ERROR';
        statusTextEl.style.color = '#ff6600';
      }
    }
    
    async function autoEmergency(bpm) {
      try {
        console.log('Auto-sending emergency for BPM:', bpm);
        const response = await fetch('https://lifedot.onrender.com/emergency', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: userId || 'demo',
            bpm: bpm,
            auto: true 
          })
        });
        
        const data = await response.json();
        console.log('Auto emergency response:', data);
        
        if (data.success) {
          showCustomAlert(`Auto Emergency Alert Sent! BPM: ${bpm}`);
        }
      } catch (error) {
        console.error('Auto emergency failed:', error);
      }
    }
    
    // Start monitoring
    fetchBPM();
    const bpmInterval = setInterval(fetchBPM, 3000);
    
    // Modal functions
    function showEmergencyModal() {
      document.getElementById('emergencyModal').style.display = 'flex';
    }
    
    function closeModal() {
      document.getElementById('emergencyModal').style.display = 'none';
    }
    
    async function sendEmergency() {
      closeModal();
      
      try {
        const currentBPM = bpmValueEl.textContent;
        let bpmValue = 0;
        
        if (currentBPM !== '--' && currentBPM !== 'ERR') {
          bpmValue = parseInt(currentBPM);
        }
        
        console.log('Sending manual emergency, BPM:', bpmValue);
        
        const response = await fetch('https://lifedot.onrender.com/emergency', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: userId || 'demo',
            bpm: bpmValue,
            manual: true 
          })
        });
        
        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Emergency response data:', data);
        
        if (data.success) {
          showCustomAlert('Emergency alert sent successfully!');
        } else {
          showCustomAlert('Failed to send alert: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Emergency send error:', error);
        showCustomAlert('Failed to send alert');
      }
    }
    
    function showCustomAlert(message) {
      const alertModal = document.createElement('div');
      alertModal.className = 'modal';
      alertModal.style.display = 'flex';
      alertModal.innerHTML = `
        <div class="modal-content">
          <h3>lifedot-topaz.vercel.app says</h3>
          <p>${message.toUpperCase()}</p>
          <div class="modal-buttons">
            <button class="btn btn-confirm" onclick="this.closest('.modal').remove()">OK</button>
          </div>
        </div>
      `;
      document.body.appendChild(alertModal);
    }
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      clearInterval(bpmInterval);
    });
  </script>
</body>
</html>
