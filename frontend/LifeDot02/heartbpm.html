<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEART MONITOR — LIFEDOT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #fff;
      overflow: hidden;
      cursor: none;
      height: 100vh;
    }
    
    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.1s ease;
      mix-blend-mode: difference;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }
    
    /* 3D SCENE */
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 40px;
      left: 50px;
      padding: 12px 30px;
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid rgba(0, 255, 255, 0.6);
      color: #00ffff;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: none;
      z-index: 100;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
      text-decoration: none;
      display: inline-block;
    }
    
    .back-btn:hover {
      background: rgba(0, 255, 255, 0.25);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
      transform: translateX(-5px);
    }
    
    /* MONITOR CONTAINER */
    .monitor-container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* PULSE RINGS */
    .pulse-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin-bottom: 50px;
    }
    
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border: 4px solid #00ffff;
      border-radius: 50%;
      opacity: 0;
      animation: pulseExpand 4s infinite;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.8),
                  inset 0 0 40px rgba(0, 255, 255, 0.3);
    }
    
    .pulse-ring:nth-child(2) {
      animation-delay: 1.3s;
    }
    
    .pulse-ring:nth-child(3) {
      animation-delay: 2.6s;
    }
    
    @keyframes pulseExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }
    
    /* BPM DISPLAY */
    .bpm-display {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .bpm-value {
      font-size: clamp(80px, 15vw, 140px);
      font-weight: 700;
      color: #00ffff;
      text-shadow: 0 0 60px rgba(0, 255, 255, 1),
                   0 0 120px rgba(0, 255, 255, 0.8),
                   0 0 180px rgba(0, 255, 255, 0.6);
      letter-spacing: -3px;
      margin-bottom: 15px;
      animation: glow 2s infinite;
    }
    
    @keyframes glow {
      0%, 100% {
        text-shadow: 0 0 60px rgba(0, 255, 255, 1),
                     0 0 120px rgba(0, 255, 255, 0.8),
                     0 0 180px rgba(0, 255, 255, 0.6);
      }
      50% {
        text-shadow: 0 0 80px rgba(0, 255, 255, 1),
                     0 0 160px rgba(0, 255, 255, 1),
                     0 0 240px rgba(0, 255, 255, 0.8);
      }
    }
    
    .bpm-value.danger {
      color: #ff0064;
      text-shadow: 0 0 60px rgba(255, 0, 100, 1),
                   0 0 120px rgba(255, 0, 100, 0.8),
                   0 0 180px rgba(255, 0, 100, 0.6);
      animation: dangerPulse 1s infinite;
    }
    
    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .bpm-label {
      font-size: 18px;
      letter-spacing: 5px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }
    
    /* STATUS */
    .status-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }
    
    .status-dot {
      width: 20px;
      height: 20px;
      background: #00ffff;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 255, 255, 1);
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .status-text {
      font-size: 16px;
      letter-spacing: 3px;
      color: #00ffff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    
    /* EMERGENCY BUTTON */
    .emergency-btn {
      padding: 20px 60px;
      background: rgba(255, 0, 100, 0.2);
      border: 3px solid #ff0064;
      color: #ff0064;
      font-size: 14px;
      letter-spacing: 4px;
      cursor: none;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      box-shadow: 0 0 40px rgba(255, 0, 100, 0.5),
                  inset 0 0 30px rgba(255, 0, 100, 0.2);
      text-shadow: 0 0 20px rgba(255, 0, 100, 0.8);
    }
    
    .emergency-btn:hover {
      background: rgba(255, 0, 100, 0.3);
      box-shadow: 0 0 60px rgba(255, 0, 100, 0.8),
                  inset 0 0 40px rgba(255, 0, 100, 0.3);
      transform: scale(1.05);
    }
    
    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(15px);
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: rgba(80, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      border: 3px solid rgba(255, 0, 100, 0.6);
      padding: 60px;
      max-width: 550px;
      width: 90%;
      box-shadow: 0 0 80px rgba(255, 0, 100, 0.5);
      text-align: center;
    }
    
    .modal-content h3 {
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 20px;
      color: #ff0064;
      text-shadow: 0 0 30px rgba(255, 0, 100, 1);
      letter-spacing: 2px;
    }
    
    .modal-content p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 40px;
      font-size: 15px;
      line-height: 1.8;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }
    
    .modal-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    
    .btn {
      padding: 16px 40px;
      font-size: 13px;
      letter-spacing: 2px;
      border: none;
      cursor: none;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 600;
    }
    
    .btn-cancel {
      background: transparent;
      border: 2px solid rgba(0, 255, 255, 0.6);
      color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    
    .btn-cancel:hover {
      background: rgba(0, 255, 255, 0.15);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
    }
    
    .btn-confirm {
      background: #ff0064;
      color: #fff;
      box-shadow: 0 0 40px rgba(255, 0, 100, 0.6);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    
    .btn-confirm:hover {
      box-shadow: 0 0 60px rgba(255, 0, 100, 1);
      transform: scale(1.05);
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor { display: none; }
      .back-btn { left: 20px; top: 20px; }
      .pulse-container { width: 300px; height: 300px; }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  
  <!-- 3D Scene -->
  <canvas id="scene"></canvas>
  
  <!-- Back Button -->
  <a href="home.html" class="back-btn">← BACK TO DASHBOARD</a>
  
  <!-- Monitor Container -->
  <div class="monitor-container">
    <div class="pulse-container">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
    </div>
    
    <div class="bpm-display">
      <div class="bpm-value" id="bpmValue">--</div>
      <div class="bpm-label">BEATS PER MINUTE</div>
    </div>
    
    <div class="status-container">
      <div class="status-dot"></div>
      <div class="status-text" id="statusText">MONITORING ACTIVE</div>
    </div>
    
    <button class="emergency-btn" onclick="showEmergencyModal()">
      🚨 EMERGENCY ALERT
    </button>
  </div>
  
  <!-- Emergency Modal -->
  <div id="emergencyModal" class="modal">
    <div class="modal-content">
      <h3>⚠️ EMERGENCY ALERT</h3>
      <p>THIS WILL IMMEDIATELY NOTIFY YOUR EMERGENCY CONTACTS. DO YOU WANT TO PROCEED?</p>
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeModal()">CANCEL</button>
        <button class="btn btn-confirm" onclick="sendEmergency()">CONFIRM ALERT</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Custom Cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    
    // Three.js Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    camera.position.z = 5;
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 15;
      posArray[i + 1] = (Math.random() - 0.5) * 15;
      posArray[i + 2] = (Math.random() - 0.5) * 15;
      
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() * 0.5 + 0.5;
      colorArray[i + 2] = Math.random() * 0.5 + 0.5;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.015,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      
      particlesMesh.rotation.x += 0.0003;
      particlesMesh.rotation.y += 0.0005;
      
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // BPM Monitoring
    const userId = localStorage.getItem("lifedot_user_id");
    const bpmValueEl = document.getElementById('bpmValue');
    const statusTextEl = document.getElementById('statusText');
    
    if (!userId) {
      window.location.href = 'login.html';
    }
    
    let lastEmergencyTime = 0;
    
    async function fetchBPM() {
      try {
        const res = await fetch('https://lifedot.onrender.com/bpm');
        const data = await res.json();
        
        if (data.bpm !== undefined) {
          const bpm = data.bpm;
          bpmValueEl.textContent = bpm;
          
          // Check for danger levels
          if (bpm <= 40 || bpm >= 150) {
            bpmValueEl.classList.add('danger');
            statusTextEl.textContent = 'CRITICAL - DANGER ZONE';
            statusTextEl.style.color = '#ff0064';
            
            // Auto emergency after 5 seconds
            const now = Date.now();
            if (now - lastEmergencyTime > 10000) {
              lastEmergencyTime = now;
              setTimeout(() => {
                if (bpmValueEl.classList.contains('danger')) {
                  autoEmergency(bpm);
                }
              }, 5000);
            }
          } else if (bpm < 60 || bpm > 100) {
            bpmValueEl.classList.remove('danger');
            statusTextEl.textContent = 'WARNING - ABNORMAL';
            statusTextEl.style.color = '#ffaa00';
          } else {
            bpmValueEl.classList.remove('danger');
            statusTextEl.textContent = 'NORMAL - HEALTHY';
            statusTextEl.style.color = '#00ffff';
          }
        }
      } catch (error) {
        bpmValueEl.textContent = 'ERR';
        statusTextEl.textContent = 'CONNECTION ERROR';
      }
    }
    
    async function autoEmergency(bpm) {
      try {
        await fetch('https://lifedot.onrender.com/emergency', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: userId,
            bpm: bpm,
            auto: true 
          })
        });
        alert(`AUTO EMERGENCY ALERT SENT - BPM: ${bpm}`);
      } catch (error) {
        console.error('Auto emergency failed');
      }
    }
    
    // Start monitoring
    fetchBPM();
    setInterval(fetchBPM, 3000);
    
    // Modal functions
    function showEmergencyModal() {
      document.getElementById('emergencyModal').style.display = 'flex';
    }
    
    function closeModal() {
      document.getElementById('emergencyModal').style.display = 'none';
    }
    
    async function sendEmergency() {
      try {
        const currentBPM = bpmValueEl.textContent;
        const res = await fetch('https://lifedot.onrender.com/emergency', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: userId,
            bpm: currentBPM,
            manual: true 
          })
        });
        
        if (res.ok) {
          alert('EMERGENCY ALERT SENT SUCCESSFULLY');
          closeModal();
        } else {
          alert('FAILED TO SEND ALERT');
        }
      } catch (error) {
        alert('CONNECTION ERROR');
      }
    }
  </script>
</body>
</html>
