<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeDot — Heart Rate Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #000000;
      --bg-layer: #0a0a0a;
      --text-white: #ffffff;
      --text-gray: #666666;
      --accent: #00ff9d;
      --accent-blue: #00d4ff;
      --danger: #ff0064;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* CUSTOM CURSOR */
    .cursor-trail {
      position: fixed;
      width: 60px;
      height: 60px;
      pointer-events: none;
      z-index: 10000;
      mix-blend-mode: screen;
    }
    
    .cursor-trail canvas {
      width: 100%;
      height: 100%;
    }

    /* ANIMATED BACKGROUND */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* PULSE RINGS */
    .pulse-ring {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      opacity: 0;
      z-index: 0;
      animation: pulseRing 4s ease-out infinite;
    }

    .pulse-ring:nth-child(2) { animation-delay: 1.3s; }
    .pulse-ring:nth-child(3) { animation-delay: 2.6s; }

    @keyframes pulseRing {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0.7;
        border-width: 3px;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
        border-width: 1px;
      }
    }

    /* CONTAINER */
    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      width: 100%;
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 5rem 4rem;
      text-align: center;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(80px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-blue), transparent);
    }

    .container::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, var(--accent-blue), transparent);
    }

    /* HEADER */
    .header {
      margin-bottom: 4rem;
    }

    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: clamp(2rem, 4vw, 2.5rem);
      background: linear-gradient(135deg, var(--text-white), var(--text-gray));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-gray);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-family: 'JetBrains Mono', monospace;
    }

    /* BPM DISPLAY */
    .bpm-display {
      margin: 4rem 0;
      padding: 4rem 3rem;
      background: linear-gradient(135deg, rgba(0,255,157,0.03), rgba(0,212,255,0.03));
      border: 1px solid rgba(0,255,157,0.15);
      position: relative;
      overflow: hidden;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .bpm-display::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,157,0.05), transparent);
      animation: shimmer 4s ease infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .bpm-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-gray);
      margin-bottom: 2rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .bpm-value {
      font-size: clamp(5rem, 12vw, 9rem);
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.05em;
      margin: 2rem 0;
      text-shadow: 0 0 60px rgba(0, 255, 157, 0.5);
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .bpm-value.danger {
      color: var(--danger);
      text-shadow: 0 0 60px rgba(255, 0, 100, 0.6);
      animation: dangerPulse 1s ease infinite;
    }

    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .bpm-average {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: var(--text-gray);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-family: 'JetBrains Mono', monospace;
      position: relative;
      z-index: 1;
    }

    .bpm-average span {
      display: block;
      color: var(--text-white);
      font-size: 2rem;
      font-weight: 700;
      margin-top: 1rem;
      letter-spacing: -0.02em;
    }

    /* STATUS INDICATOR */
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem 2rem;
      background: rgba(0, 255, 157, 0.05);
      border: 1px solid rgba(0, 255, 157, 0.2);
      margin-bottom: 3rem;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 2s infinite;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.6);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .status-indicator.danger {
      background: rgba(255, 0, 100, 0.05);
      border-color: rgba(255, 0, 100, 0.3);
      color: var(--danger);
    }

    .status-indicator.danger .status-dot {
      background: var(--danger);
      box-shadow: 0 0 20px rgba(255, 0, 100, 0.6);
    }

    /* BUTTONS */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .btn {
      padding: 1.5rem 2rem;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      position: relative;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }

    .btn-emergency {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .btn-emergency::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--danger);
      transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
    }

    .btn-emergency:hover {
      color: white;
      transform: translateY(-5px);
      box-shadow: 0 20px 60px rgba(255, 0, 100, 0.4);
    }

    .btn-emergency:hover::before {
      left: 0;
    }

    .btn-back {
      background: transparent;
      color: var(--text-white);
      border: 1px solid rgba(255,255,255,0.1);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .btn-back::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.05);
      transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
    }

    .btn-back:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
    }

    .btn-back:hover::before {
      left: 0;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-layer);
      padding: 4rem 3rem;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
      animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      position: relative;
    }

    .modal-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--danger), transparent);
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(-30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, rgba(255,0,100,0.1), rgba(255,0,100,0.05));
      border: 1px solid rgba(255,0,100,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 0 auto 2rem;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .modal-content h3 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-content p {
      color: var(--text-gray);
      margin-bottom: 3rem;
      line-height: 1.8;
      font-size: 0.95rem;
      font-weight: 300;
    }

    .modal-buttons {
      display: flex;
      gap: 1.5rem;
    }

    .btn-modal {
      flex: 1;
      padding: 1.2rem;
      border: none;
      font-weight: 600;
      cursor: none;
      transition: all 0.3s ease;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      position: relative;
      overflow: hidden;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-white);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-cancel::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.05);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .btn-cancel:hover::before {
      left: 0;
    }

    .btn-confirm {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-confirm::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--danger);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .btn-confirm:hover {
      color: white;
    }

    .btn-confirm:hover::before {
      left: 0;
    }

    /* STATUS MESSAGE */
    .status-message {
      margin-top: 2rem;
      padding: 1.2rem;
      font-weight: 600;
      font-size: 0.8rem;
      text-align: center;
      display: none;
      animation: slideDown 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-message.success {
      background: rgba(0, 255, 157, 0.1);
      color: var(--accent);
      border: 1px solid rgba(0, 255, 157, 0.3);
    }

    .status-message.error {
      background: rgba(255, 0, 100, 0.1);
      color: var(--danger);
      border: 1px solid rgba(255, 0, 100, 0.3);
    }

    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 2rem;
      left: 2rem;
      padding: 1rem 2rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-white);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: none;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-decoration: none;
      z-index: 100;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      font-family: 'Space Grotesk', sans-serif;
    }

    .back-btn:hover {
      border-color: var(--accent);
      transform: translateX(-5px);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body {
        cursor: auto;
      }

      .cursor-trail {
        display: none;
      }

      .container {
        padding: 3rem 2rem;
      }

      .bpm-display {
        padding: 3rem 2rem;
      }

      .back-btn {
        top: 1rem;
        left: 1rem;
        padding: 0.8rem 1.5rem;
        font-size: 0.7rem;
      }

      .button-group {
        gap: 1rem;
      }

      .modal-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="cursor-trail">
    <canvas id="cursor-canvas"></canvas>
  </div>
  
  <canvas id="bg-canvas"></canvas>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>

  <a href="home.html" class="back-btn">← BACK</a>

  <div class="container">
    <div class="header">
      <h1>HEART MONITOR</h1>
      <p>Real-time cardiac tracking</p>
    </div>

    <div class="bpm-display">
      <div class="bpm-label">Current Heart Rate</div>
      <div id="bpmValue" class="bpm-value">--</div>
      <div class="bpm-average">
        Average Today
        <span id="avgBpm">-- BPM</span>
      </div>
    </div>

    <div class="status-indicator" id="statusIndicator">
      <span class="status-dot"></span>
      <span>Heart rate normal</span>
    </div>

    <div class="button-group">
      <button class="btn btn-emergency" onclick="openModal()">
        🚨 Send Emergency Alert
      </button>
      <button class="btn btn-back" onclick="window.location.href='home.html'">
        ← Back to Dashboard
      </button>
    </div>

    <div id="statusMsg" class="status-message"></div>
  </div>

  <div id="alertModal" class="modal">
    <div class="modal-content">
      <div class="modal-icon">🚨</div>
      <h3>Send Emergency Alert?</h3>
      <p>This will immediately notify all your emergency contacts about a potential health issue.</p>
      <div class="modal-buttons">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-confirm" onclick="sendEmergency()">Send Alert</button>
      </div>
    </div>
  </div>

  <script>
    // Enhanced Cursor Trail
    const cursorTrail = document.querySelector('.cursor-trail');
    const cursorCanvas = document.getElementById('cursor-canvas');
    const cursorCtx = cursorCanvas.getContext('2d');
    
    cursorCanvas.width = 120;
    cursorCanvas.height = 120;
    
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetX = mouseX;
    let targetY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });
    
    function animateCursor() {
      mouseX += (targetX - mouseX) * 0.1;
      mouseY += (targetY - mouseY) * 0.1;
      
      cursorTrail.style.left = (mouseX - 60) + 'px';
      cursorTrail.style.top = (mouseY - 60) + 'px';
      
      cursorCtx.clearRect(0, 0, 120, 120);
      cursorCtx.strokeStyle = 'rgba(0, 255, 157, 0.6)';
      cursorCtx.lineWidth = 1;
      
      for (let i = 0; i < 5; i++) {
        const size = 20 + i * 10;
        const offset = Math.sin(Date.now() * 0.001 + i) * 5;
        cursorCtx.beginPath();
        cursorCtx.arc(60 + offset, 60 + offset, size, 0, Math.PI * 2);
        cursorCtx.stroke();
      }
      
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Particle Background
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;
        this.size = Math.random() * 1.5;
        this.life = Math.random();
      }
      
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.001;
        
        if (this.life <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      
      draw() {
        ctx.fillStyle = `rgba(0, 255, 157, ${this.life * 0.15})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }
    
    const particles = Array.from({ length: 100 }, () => new Particle());
    
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();

    // BPM Monitoring
    const bpmValue = document.getElementById("bpmValue");
    const avgBpm = document.getElementById("avgBpm");
    const statusMsg = document.getElementById("statusMsg");
    const statusIndicator = document.getElementById("statusIndicator");
    const modal = document.getElementById("alertModal");
    let autoAlertSent = false;

    async function fetchBpm() {
      try {
        const res = await fetch("https://lifedot.onrender.com/bpm");
        const data = await res.json();
        
        bpmValue.textContent = data.bpm;
        avgBpm.textContent = `${data.avg_bpm} BPM`;

        if (data.bpm <= 40 || data.bpm >= 150) {
          bpmValue.classList.add("danger");
          statusIndicator.classList.add("danger");
          statusIndicator.innerHTML = '<span class="status-dot"></span><span>⚠️ Critical heart rate detected!</span>';
          
          if (!autoAlertSent) {
            autoEmergency();
          }
        } else {
          bpmValue.classList.remove("danger");
          statusIndicator.classList.remove("danger");
          statusIndicator.innerHTML = '<span class="status-dot"></span><span>Heart rate normal</span>';
          autoAlertSent = false;
        }
      } catch (error) {
        bpmValue.textContent = "--";
        avgBpm.textContent = "-- BPM";
      }
    }

    function openModal() {
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    window.onclick = (event) => {
      if (event.target === modal) {
        closeModal();
      }
    };

    async function sendEmergency() {
      closeModal();
      showStatus("Sending emergency alert...", "");
      
      try {
        const res = await fetch("https://lifedot.onrender.com/emergency", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          showStatus("✅ Emergency alert sent successfully!", "success");
        } else {
          showStatus("❌ Failed to send emergency alert.", "error");
        }
      } catch (error) {
        showStatus("⚠️ Unable to connect to server.", "error");
      }
    }

    async function autoEmergency() {
      if (autoAlertSent) return;
      autoAlertSent = true;

      showStatus("⚠️ Critical BPM! Sending automatic alert...", "");

      try {
        const res = await fetch("https://lifedot.onrender.com/emergency", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          showStatus("✅ Automatic emergency alert sent!", "success");
        } else {
          showStatus("❌ Failed to send automatic alert.", "error");
        }
      } catch (error) {
        showStatus("⚠️ Unable to connect to server.", "error");
      }
    }

    function showStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className = `status-message ${type}`;
      statusMsg.style.display = "block";

      if (type) {
        setTimeout(() => {
          statusMsg.style.display = "none";
        }, 5000);
      }
    }

    setInterval(fetchBpm, 3000);
    fetchBpm();
  </script>
</body>
</html>
