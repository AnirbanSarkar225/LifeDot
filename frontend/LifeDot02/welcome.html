<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — LifeDot</title>
  <link rel="stylesheet" href="assets/css/immersive.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      overflow: hidden;
    }
    
    /* CURSOR */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(0, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
      mix-blend-mode: screen;
    }
    
    .cursor-ring {
      position: fixed;
      width: 35px;
      height: 35px;
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      mix-blend-mode: screen;
    }
    
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* CONTAINER */
    .welcome-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 900px;
      padding: 0 50px;
      animation: fadeIn 1.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .welcome-icon {
      font-size: 100px;
      margin-bottom: 40px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(0, 255, 255, 0.6));
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    h1 {
      font-size: clamp(60px, 12vw, 100px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 30px;
      background: linear-gradient(180deg, #fff 0%, rgba(0, 255, 255, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .username {
      color: rgba(0, 255, 255, 1);
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.7);
    }
    
    p {
      font-size: 15px;
      line-height: 2;
      letter-spacing: 3px;
      opacity: 0.7;
      margin-bottom: 60px;
      font-weight: 300;
      color: rgba(0, 255, 255, 0.8);
      text-transform: uppercase;
    }
    
    .button-group {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 22px 60px;
      font-size: 12px;
      letter-spacing: 3px;
      border: none;
      background: none;
      color: #fff;
      text-decoration: none;
      cursor: none;
      font-weight: 400;
      transition: all 0.4s ease;
      text-transform: uppercase;
      border-radius: 35px;
    }
    
    .btn-primary {
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }
    
    .btn-primary:hover {
      background: rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
      transform: translateY(-3px);
    }
    
    .btn-secondary {
      border: 2px solid rgba(255, 255, 255, 0.25);
    }
    
    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-3px);
    }
    
    /* LOADING */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.8s ease;
    }
    
    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(0, 255, 255, 0.2);
      border-top: 3px solid rgba(0, 255, 255, 1);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
      .welcome-container { padding: 0 30px; }
      .button-group { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
  </div>
  
  <canvas id="canvas3d"></canvas>
  
  <div class="welcome-container">
    <div class="welcome-icon">💓</div>
    <h1>Welcome<br><span class="username" id="username">User</span></h1>
    <p>Your health monitoring system is ready</p>
    <div class="button-group">
      <a href="home.html" class="btn btn-primary">Go to Dashboard</a>
      <a href="flowchart.html" class="btn btn-secondary">View Workflow</a>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/js/immersive.js"></script>
  <script>
    // Three.js
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.04);
    camera.position.set(0, 5, 15);
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 3000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 60;
      posArray[i + 1] = (Math.random() - 0.5) * 60;
      posArray[i + 2] = (Math.random() - 0.5) * 60;
      
      const colorChoice = Math.random();
      if (colorChoice < 0.4) {
        colorArray[i] = 0;
        colorArray[i + 1] = 1;
        colorArray[i + 2] = 1;
      } else if (colorChoice < 0.7) {
        colorArray[i] = 0.4;
        colorArray[i + 1] = 0;
        colorArray[i + 2] = 1;
      } else {
        colorArray[i] = 0;
        colorArray[i + 1] = 0.5;
        colorArray[i + 2] = 1;
      }
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0x0a2e4a, 0.6);
    scene.add(ambientLight);
    
    const pointLight1 = new THREE.PointLight(0x00ffff, 1.2, 100);
    pointLight1.position.set(12, 12, 12);
    scene.add(pointLight1);
    
    const pointLight2 = new THREE.PointLight(0x0066ff, 1, 100);
    pointLight2.position.set(-12, -12, -12);
    scene.add(pointLight2);
    
    // Mouse movement
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    // Animation
    function animate() {
      requestAnimationFrame(animate);
      
      particlesMesh.rotation.y += 0.0006;
      particlesMesh.rotation.x += 0.0003;
      
      camera.position.x += (targetX * 2.5 - camera.position.x) * 0.05;
      camera.position.y += (targetY * 2.5 - camera.position.y + 5) * 0.05;
      
      renderer.render(scene, camera);
    }
    animate();
    
    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Get username
    const username = localStorage.getItem("lifedot_user") || "User";
    document.getElementById("username").textContent = username;
    
    // Loading
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hide');
      }, 1000);
    });
  </script>
</body>
</html>
