<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .register-container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 550px;
      width: 100%;
      padding: 3rem;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1rem;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #1a202c;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      background: #f7fafc;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-register {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-register:active {
      transform: translateY(0);
    }

    .links {
      text-align: center;
      margin-top: 1.5rem;
      color: #718096;
      font-size: 0.9rem;
    }

    .links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 10px;
      font-weight: 600;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.success {
      background: #c6f6d5;
      color: #22543d;
      border: 2px solid #9ae6b4;
    }

    .message.error {
      background: #fed7d7;
      color: #742a2a;
      border: 2px solid #fc8181;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .register-container {
        padding: 2rem;
      }

      h2 {
        font-size: 1.75rem;
      }

      .grid-2 {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="logo-container">
      <h2>Create Account</h2>
      <p class="subtitle">Join LifeDot and start monitoring your health</p>
    </div>

    <div class="input-group">
      <label>Full Name</label>
      <input id="name" type="text" placeholder="John Doe" required>
    </div>

    <div class="input-group">
      <label>Address</label>
      <textarea id="address" placeholder="Your complete address" required></textarea>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>Phone Number</label>
        <input id="phone" type="tel" placeholder="+1 234 567 8900" required>
      </div>

      <div class="input-group">
        <label>Alternate Phone</label>
        <input id="altPhone" type="tel" placeholder="+1 234 567 8900">
      </div>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="Min. 8 characters" required>
    </div>

    <button class="btn-register" onclick="handleRegister()">Create Account</button>

    <div class="links">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

    <div id="msg" class="message"></div>
  </div>

  <script>
    const msg = document.getElementById('msg');

    async function handleRegister() {
      const name = document.getElementById('name').value;
      const address = document.getElementById('address').value;
      const phone = document.getElementById('phone').value;
      const altPhone = document.getElementById('altPhone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Validation
      if (!name || !address || !phone || !email || !password) {
        showMessage('Please fill in all required fields', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters', 'error');
        return;
      }

      const payload = {
        name,
        address,
        phone_number: phone,
        alt_phone_number: altPhone || phone,
        email,
        password
      };

      try {
        const res = await fetch('http://127.0.0.1:8000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          showMessage('Account created successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage(data.error || 'Registration failed. Email may already be in use.', 'error');
        }
      } catch (error) {
        showMessage('Unable to connect to server. Please try again.', 'error');
      }
    }

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';

      setTimeout(() => {
        msg.style.display = 'none';
      }, 5000);
    }
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleRegister();
    });
  </script>
</body>
</html>
