<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTER — LIFEDOT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      cursor: none;
      overflow-x: hidden;
    }
    
    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.1s ease;
      mix-blend-mode: difference;
    }
    
    /* 3D SCENE */
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* BACK LINK */
    .back-link {
      position: fixed;
      top: 40px;
      left: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #00ffff;
      text-decoration: none;
      z-index: 100;
      opacity: 0.7;
      transition: all 0.3s;
      mix-blend-mode: difference;
    }
    
    .back-link:hover {
      opacity: 1;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    /* REGISTER CONTAINER */
    .register-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 60px 50px;
      background: rgba(0, 30, 40, 0.3);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
      animation: slideIn 0.8s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .header h1 {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
    
    .header p {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.6;
    }
    
    /* FORM */
    .form-group {
      margin-bottom: 30px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #00ffff;
      opacity: 0.7;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 15px;
      background: rgba(0, 255, 255, 0.03);
      border: none;
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
      border: 1px solid rgba(0, 255, 255, 0.3);
    }
    
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      background: rgba(0, 255, 255, 0.05);
      border-bottom-color: #00ffff;
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.1);
    }
    
    .form-group textarea:focus {
      border-color: #00ffff;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    /* STATUS ICON */
    .status-icon {
      position: absolute;
      right: 15px;
      top: 38px;
      width: 20px;
      height: 20px;
      border: 2px solid #00ffff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .form-group input:focus ~ .status-icon {
      opacity: 0.5;
    }
    
    /* BUTTON */
    .btn-register {
      width: 100%;
      padding: 18px;
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #00ffff;
      color: #00ffff;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: none;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }
    
    .btn-register::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: #00ffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }
    
    .btn-register:hover::before {
      width: 600px;
      height: 600px;
    }
    
    .btn-register:hover {
      color: #000;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
    }
    
    .btn-register span {
      position: relative;
      z-index: 1;
    }
    
    /* LINKS */
    .links {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }
    
    .links a {
      color: #00ffff;
      text-decoration: none;
      opacity: 0.7;
      transition: all 0.3s;
    }
    
    .links a:hover {
      opacity: 1;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    /* MESSAGE */
    .message {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      font-size: 11px;
      letter-spacing: 1px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .message.success {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #00ffff;
      color: #00ffff;
    }
    
    .message.error {
      background: rgba(255, 0, 100, 0.1);
      border: 1px solid #ff0064;
      color: #ff0064;
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor { display: none; }
      .register-container { padding: 40px 30px; }
      .back-link { left: 20px; top: 20px; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  
  <!-- 3D Scene -->
  <canvas id="scene"></canvas>
  
  <!-- Back Link -->
  <a href="index.html" class="back-link">← BACK</a>
  
  <!-- Register Container -->
  <div class="register-container">
    <div class="header">
      <h1>CREATE ACCOUNT</h1>
      <p>JOIN LIFEDOT</p>
    </div>
    
    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>FULL NAME</label>
        <input id="name" type="text" placeholder="Enter your name" required>
        <div class="status-icon"></div>
      </div>
      
      <div class="form-group">
        <label>ADDRESS</label>
        <textarea id="address" placeholder="Your complete address" required></textarea>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>PHONE NUMBER</label>
          <input id="phone" type="tel" placeholder="+91xxxxxxxxxx" required>
          <div class="status-icon"></div>
        </div>
        
        <div class="form-group">
          <label>ALTERNATE PHONE</label>
          <input id="altPhone" type="tel" placeholder="+91xxxxxxxxxx">
          <div class="status-icon"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input id="email" type="email" placeholder="your@email.com" required>
        <div class="status-icon"></div>
      </div>
      
      <div class="form-group">
        <label>PASSWORD</label>
        <input id="password" type="password" placeholder="Min. 8 characters" required>
        <div class="status-icon"></div>
      </div>
      
      <button type="submit" class="btn-register">
        <span>CREATE ACCOUNT</span>
      </button>
      
      <div class="links">
        ALREADY HAVE AN ACCOUNT? <a href="login.html">SIGN IN</a>
      </div>
      
      <div id="msg" class="message"></div>
    </form>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Custom Cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    
    // Three.js Scene (Same as login)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    camera.position.z = 5;
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 15;
      posArray[i + 1] = (Math.random() - 0.5) * 15;
      posArray[i + 2] = (Math.random() - 0.5) * 15;
      
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() * 0.5 + 0.5;
      colorArray[i + 2] = Math.random() * 0.5 + 0.5;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.015,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      
      particlesMesh.rotation.x += 0.0003;
      particlesMesh.rotation.y += 0.0005;
      
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Register
    const msg = document.getElementById('msg');
    
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const address = document.getElementById('address').value;
      const phone = document.getElementById('phone').value;
      const altPhone = document.getElementById('altPhone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!name || !address || !phone || !email || !password) {
        showMessage('FILL IN ALL REQUIRED FIELDS', 'error');
        return;
      }
      
      if (password.length < 8) {
        showMessage('PASSWORD MUST BE 8+ CHARACTERS', 'error');
        return;
      }
      
      const payload = {
        name,
        address,
        phone_number: phone,
        alt_phone_number: altPhone || phone,
        email,
        password
      };
      
      try {
        const res = await fetch('https://lifedot.onrender.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.success) {
          showMessage('ACCOUNT CREATED SUCCESSFULLY', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage(data.error || 'REGISTRATION FAILED', 'error');
        }
      } catch (error) {
        showMessage('UNABLE TO CONNECT', 'error');
      }
    }
    
    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      
      setTimeout(() => {
        msg.style.display = 'none';
      }, 5000);
    }
    
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleRegister(e);
    });
  </script>
</body>
</html>
