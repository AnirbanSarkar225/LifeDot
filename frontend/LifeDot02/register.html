<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register — LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow-x: hidden;
    }

    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }
    
    .cursor-follower {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10001;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    #gridCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
    }

    .register-container {
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.05);
      max-width: 600px;
      width: 100%;
      padding: 80px 60px;
      position: relative;
      z-index: 10;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .register-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.3), transparent);
    }

    .header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header h2 {
      font-size: 32px;
      font-weight: 200;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .input-group {
      margin-bottom: 30px;
    }

    .input-group label {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 12px;
      font-weight: 300;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 18px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 15px;
      transition: border-color 0.3s;
      outline: none;
      font-weight: 300;
      font-family: inherit;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      border-color: rgba(255,255,255,0.3);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .btn-register {
      width: 100%;
      padding: 20px;
      background: #fff;
      color: #000;
      border: none;
      font-size: 11px;
      font-weight: 300;
      cursor: none;
      transition: all 0.3s ease;
      margin-top: 20px;
      letter-spacing: 2px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    }

    .btn-register:hover {
      background: rgba(255,255,255,0.9);
      transform: translateY(-3px);
    }

    .links {
      text-align: center;
      margin-top: 30px;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    .links a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
    }

    .links a:hover {
      color: #fff;
    }

    .message {
      text-align: center;
      margin-top: 30px;
      padding: 18px;
      font-weight: 300;
      font-size: 11px;
      display: none;
      letter-spacing: 2px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }

    .message.success {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
    }

    .message.error {
      background: rgba(255,0,0,0.05);
      border: 1px solid rgba(255,0,0,0.3);
      color: #ff0000;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .register-container { padding: 60px 40px; }
      body { cursor: auto; }
      .cursor, .cursor-follower { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>
  <canvas id="gridCanvas"></canvas>

  <div class="register-container">
    <div class="header">
      <h2>Create Account</h2>
      <p class="subtitle">JOIN LIFEDOT</p>
    </div>

    <div class="input-group">
      <label>FULL NAME</label>
      <input id="name" type="text" placeholder="Enter your name" required>
    </div>

    <div class="input-group">
      <label>ADDRESS</label>
      <textarea id="address" placeholder="Your complete address" required></textarea>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>PHONE NUMBER</label>
        <input id="phone" type="tel" placeholder="+91xxxxxxxxxx" required>
      </div>
      <div class="input-group">
        <label>ALTERNATE PHONE</label>
        <input id="altPhone" type="tel" placeholder="+91xxxxxxxxxx">
      </div>
    </div>

    <div class="input-group">
      <label>EMAIL ADDRESS</label>
      <input id="email" type="email" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label>PASSWORD</label>
      <input id="password" type="password" placeholder="Min. 8 characters" required>
    </div>

    <button class="btn-register" onclick="handleRegister()">CREATE ACCOUNT</button>

    <div class="links">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

    <div id="msg" class="message"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cursor
    const cursor = document.querySelector('.cursor');
    const cursorFollower = document.querySelector('.cursor-follower');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let followerX = mouseX, followerY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateFollower() {
      followerX += (mouseX - followerX) * 0.1;
      followerY += (mouseY - followerY) * 0.1;
      cursorFollower.style.left = followerX + 'px';
      cursorFollower.style.top = followerY + 'px';
      requestAnimationFrame(animateFollower);
    }
    animateFollower();

    // Grid
    const canvas = document.getElementById('gridCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.set(0, 2, 5);
    camera.rotation.x = -0.3;
    
    const gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0xffffff);
    gridHelper.material.opacity = 0.05;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);
    
    function animate() {
      requestAnimationFrame(animate);
      gridHelper.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    // Register
    async function handleRegister() {
      const name = document.getElementById('name').value;
      const address = document.getElementById('address').value;
      const phone = document.getElementById('phone').value;
      const altPhone = document.getElementById('altPhone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      if (!name || !address || !phone || !email || !password) {
        showMessage('Fill in all required fields', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be 8+ characters', 'error');
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            address,
            phone_number: phone,
            alt_phone_number: altPhone || phone,
            email,
            password
          })
        });
        const data = await res.json();

        if (data.success) {
          showMessage('Account created successfully', 'success');
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          showMessage(data.error || 'Registration failed', 'error');
        }
      } catch (error) {
        showMessage('Unable to connect', 'error');
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 5000);
    }

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleRegister();
    });
  </script>
</body>
</html>
