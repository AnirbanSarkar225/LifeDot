<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register — LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow-x: hidden;
    }

    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(0, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
      mix-blend-mode: screen;
    }
    
    .cursor-ring {
      position: fixed;
      width: 35px;
      height: 35px;
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      mix-blend-mode: screen;
    }

    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .register-container {
      background: rgba(15, 25, 45, 0.5);
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 30px;
      max-width: 650px;
      width: 100%;
      padding: 85px 65px;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(25px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 255, 255, 0.1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 65px;
    }

    .header h2 {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 15px;
      background: linear-gradient(180deg, #fff 0%, rgba(0, 255, 255, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: rgba(0, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 4px;
      font-weight: 300;
      text-transform: uppercase;
    }

    .input-group {
      margin-bottom: 40px;
    }

    .input-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(0, 255, 255, 0.8);
      margin-bottom: 18px;
      font-weight: 400;
      text-transform: uppercase;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 20px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(0, 255, 255, 0.3);
      color: #fff;
      font-size: 16px;
      transition: border-color 0.3s;
      outline: none;
      font-weight: 300;
      font-family: inherit;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      border-color: rgba(0, 255, 255, 0.8);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
    }

    .btn-register {
      width: 100%;
      padding: 22px;
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 35px;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      cursor: none;
      transition: all 0.4s ease;
      margin-top: 25px;
      letter-spacing: 3px;
      backdrop-filter: blur(15px);
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }

    .btn-register:hover {
      background: rgba(0, 255, 255, 0.3);
      border-color: rgba(0, 255, 255, 0.9);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
      transform: translateY(-3px);
    }

    .links {
      text-align: center;
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    .links a {
      color: rgba(0, 255, 255, 0.9);
      text-decoration: none;
    }

    .links a:hover {
      color: #fff;
    }

    .message {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      font-weight: 300;
      font-size: 12px;
      display: none;
      letter-spacing: 2px;
      border-radius: 30px;
    }

    .message.success {
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      color: #fff;
    }

    .message.error {
      background: rgba(255, 0, 100, 0.2);
      border: 2px solid rgba(255, 0, 100, 0.5);
      color: #ff0064;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .register-container { padding: 65px 45px; }
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <canvas id="canvas3d"></canvas>

  <div class="register-container">
    <div class="header">
      <h2>Create Account</h2>
      <p class="subtitle">Join LifeDot</p>
    </div>

    <div class="input-group">
      <label>Full Name</label>
      <input id="name" type="text" placeholder="Enter your name" required>
    </div>

    <div class="input-group">
      <label>Address</label>
      <textarea id="address" placeholder="Your complete address" required></textarea>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>Phone Number</label>
        <input id="phone" type="tel" placeholder="+91xxxxxxxxxx" required>
      </div>
      <div class="input-group">
        <label>Alternate Phone</label>
        <input id="altPhone" type="tel" placeholder="+91xxxxxxxxxx">
      </div>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="Min. 8 characters" required>
    </div>

    <button class="btn-register" onclick="handleRegister()">Create Account</button>

    <div class="links">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

    <div id="msg" class="message"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cursor
    const cursor = document.querySelector('.cursor');
    const cursorRing = document.querySelector('.cursor-ring');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let ringX = mouseX, ringY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // Three.js
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.set(0, 5, 15);
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.04);
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2500;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 60;
      posArray[i + 1] = (Math.random() - 0.5) * 60;
      posArray[i + 2] = (Math.random() - 0.5) * 60;
      
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() < 0.5 ? 1 : 0.5;
      colorArray[i + 2] = 1;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    }));
    scene.add(particlesMesh);
    
    const ambientLight = new THREE.AmbientLight(0x0a2e4a, 0.6);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0x00ffff, 1.2, 100);
    pointLight.position.set(12, 12, 12);
    scene.add(pointLight);
    
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.y += 0.0006;
      camera.position.x += (targetX * 2.5 - camera.position.x) * 0.05;
      camera.position.y += (targetY * 2.5 - camera.position.y + 5) * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    // Register
    async function handleRegister() {
      const name = document.getElementById('name').value;
      const address = document.getElementById('address').value;
      const phone = document.getElementById('phone').value;
      const altPhone = document.getElementById('altPhone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!name || !address || !phone || !email || !password) {
        showMessage('Fill in all required fields', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be 8+ characters', 'error');
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            address,
            phone_number: phone,
            alt_phone_number: altPhone || phone,
            email,
            password
          })
        });
        const data = await res.json();

        if (data.success) {
          showMessage('Account created successfully', 'success');
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          showMessage(data.error || 'Registration failed', 'error');
        }
      } catch (error) {
        showMessage('Unable to connect', 'error');
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 5000);
    }
  </script>
</body>
</html>
