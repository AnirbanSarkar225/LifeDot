<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset Password - LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .reset-container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
      padding: 3rem;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1rem;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #1a202c;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      background: #f7fafc;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .password-requirements {
      background: #f7fafc;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #4a5568;
    }

    .password-requirements ul {
      margin-left: 1.2rem;
      margin-top: 0.5rem;
    }

    .password-requirements li {
      margin-bottom: 0.25rem;
    }

    .btn-reset {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .btn-reset:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-reset:active {
      transform: translateY(0);
    }

    .btn-reset:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .links {
      text-align: center;
      margin-top: 1.5rem;
      color: #718096;
      font-size: 0.9rem;
    }

    .links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 10px;
      font-weight: 600;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.success {
      background: #c6f6d5;
      color: #22543d;
      border: 2px solid #9ae6b4;
    }

    .message.error {
      background: #fed7d7;
      color: #742a2a;
      border: 2px solid #fc8181;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 1rem;
      color: #718096;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .reset-container {
        padding: 2rem;
      }

      h2 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="logo-container">
      <div class="logo-icon">🔒</div>
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your new password below</p>
    </div>

    <div class="input-group">
      <label>New Password</label>
      <input id="newPassword" type="password" placeholder="Enter new password" required>
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" required>
    </div>

    <div class="password-requirements">
      <strong>Password Requirements:</strong>
      <ul>
        <li>Minimum 8 characters</li>
        <li>Both passwords must match</li>
      </ul>
    </div>

    <button class="btn-reset" onclick="handleResetPassword()" id="resetBtn">Reset Password</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Resetting password...</span>
    </div>

    <div class="links">
      <a href="login.html">← Back to Login</a>
    </div>

    <div id="msg" class="message"></div>
  </div>

  <script>
    const msg = document.getElementById('msg');
    const loading = document.getElementById('loading');
    const resetBtn = document.getElementById('resetBtn');

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // Check if token exists
    if (!token) {
      showMessage('Invalid or missing reset token. Please request a new password reset link.', 'error');
      resetBtn.disabled = true;
    }

    async function handleResetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validation
      if (!newPassword || !confirmPassword) {
        showMessage('Please fill in both password fields', 'error');
        return;
      }

      if (newPassword.length < 8) {
        showMessage('Password must be at least 8 characters long', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }

      // Show loading state
      resetBtn.disabled = true;
      loading.style.display = 'block';
      msg.style.display = 'none';

      try {
        const res = await fetch(`http://127.0.0.1:8000/reset-password/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPassword })
        });
        const data = await res.json();

        loading.style.display = 'none';

        if (data.success) {
          showMessage('✅ Password reset successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage('❌ Failed to reset password. The link may have expired.', 'error');
          resetBtn.disabled = false;
        }
      } catch (error) {
        console.error('Reset error:', error);
        loading.style.display = 'none';
        showMessage('⚠️ Unable to connect to server. Please try again.', 'error');
        resetBtn.disabled = false;
      }
    }

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
    }

    // Enter key support
    document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !resetBtn.disabled) {
        handleResetPassword();
      }
    });
  </script>
</body>
</html>
