<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESET PASSWORD — LIFEDOT</title>
  <link rel="stylesheet" href="assets/css/immersive.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      overflow: hidden;
    }
    
    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.1s ease;
      mix-blend-mode: difference;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }
    
    /* 3D SCENE */
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* BACK LINK */
    .back-link {
      position: fixed;
      top: 40px;
      left: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #00ffff;
      text-decoration: none;
      z-index: 100;
      opacity: 1;
      transition: all 0.3s;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    
    .back-link:hover {
      text-shadow: 0 0 25px rgba(0, 255, 255, 1);
      transform: translateX(-5px);
    }
    
    /* RESET CONTAINER */
    .reset-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 550px;
      padding: 60px 50px;
      background: rgba(0, 30, 40, 0.4);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 60px rgba(0, 255, 255, 0.2),
                  inset 0 0 30px rgba(0, 255, 255, 0.05);
      animation: slideIn 0.8s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .reset-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
      animation: shimmer 3s infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }
    
    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .header h1 {
      font-size: 36px;
      font-weight: 400;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: #00ffff;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.8),
                   0 0 60px rgba(0, 255, 255, 0.5);
    }
    
    .header p {
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      line-height: 1.7;
    }
    
    /* FORM */
    .form-group {
      margin-bottom: 30px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 10px;
      color: #00ffff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    
    .form-group input {
      width: 100%;
      padding: 16px;
      background: rgba(0, 255, 255, 0.08);
      border: 2px solid rgba(0, 255, 255, 0.4);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2),
                  inset 0 0 15px rgba(0, 255, 255, 0.1);
    }
    
    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    .form-group input:focus {
      background: rgba(0, 255, 255, 0.12);
      border-color: rgba(0, 255, 255, 0.8);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4),
                  inset 0 0 20px rgba(0, 255, 255, 0.2);
    }
    
    /* STATUS ICON */
    .status-icon {
      position: absolute;
      right: 15px;
      top: 42px;
      width: 22px;
      height: 22px;
      border: 2px solid #00ffff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
    }
    
    .form-group input:focus ~ .status-icon {
      opacity: 0.7;
    }
    
    /* REQUIREMENTS */
    .password-requirements {
      margin-top: 15px;
      padding: 20px;
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.2);
      font-size: 12px;
      line-height: 1.8;
      box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.05);
    }
    
    .password-requirements h4 {
      color: #00ffff;
      margin-bottom: 10px;
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }
    
    .password-requirements ul {
      list-style: none;
      padding-left: 0;
    }
    
    .password-requirements li {
      margin: 8px 0;
      opacity: 0.7;
      position: relative;
      padding-left: 25px;
    }
    
    .password-requirements li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }
    
    .password-requirements li.valid {
      opacity: 1;
      color: #00ff88;
    }
    
    .password-requirements li.valid::before {
      content: '✓';
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
    }
    
    /* BUTTON */
    .btn-reset {
      width: 100%;
      padding: 18px;
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid #00ffff;
      color: #00ffff;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: none;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      margin-top: 30px;
      position: relative;
      overflow: hidden;
      font-weight: 600;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4),
                  inset 0 0 20px rgba(0, 255, 255, 0.1);
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
    }
    
    .btn-reset::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: #00ffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }
    
    .btn-reset:hover::before {
      width: 600px;
      height: 600px;
    }
    
    .btn-reset:hover {
      color: #000;
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.8),
                  inset 0 0 30px rgba(0, 255, 255, 0.3);
    }
    
    .btn-reset span {
      position: relative;
      z-index: 1;
    }
    
    /* LINKS */
    .links {
      text-align: center;
      margin-top: 30px;
      font-size: 13px;
    }
    
    .links a {
      color: #00ffff;
      text-decoration: none;
      opacity: 0.9;
      transition: all 0.3s;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }
    
    .links a:hover {
      opacity: 1;
      text-shadow: 0 0 20px rgba(0, 255, 255, 1);
    }
    
    /* MESSAGE */
    .message {
      text-align: center;
      margin-top: 25px;
      padding: 18px;
      font-size: 13px;
      letter-spacing: 1px;
      display: none;
      animation: fadeIn 0.3s ease;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .message.success {
      background: rgba(0, 255, 136, 0.15);
      border: 2px solid #00ff88;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }
    
    .message.error {
      background: rgba(255, 0, 100, 0.15);
      border: 2px solid #ff0064;
      color: #ff0064;
      text-shadow: 0 0 10px rgba(255, 0, 100, 0.6);
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
      .reset-container { padding: 40px 30px; margin: 20px; }
      .back-link { left: 20px; top: 20px; }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  
  <!-- 3D Scene -->
  <canvas id="scene"></canvas>
  
  <!-- Back Link -->
  <a href="login.html" class="back-link">← BACK TO LOGIN</a>
  
  <!-- Reset Container -->
  <div class="reset-container">
    <div class="header">
      <h1>RESET PASSWORD</h1>
      <p>ENTER YOUR NEW PASSWORD BELOW</p>
    </div>
    
    <form onsubmit="handleReset(event)">
      <div class="form-group">
        <label>NEW PASSWORD</label>
        <input id="newPassword" type="password" placeholder="Enter new password" required oninput="validatePassword()">
        <div class="status-icon"></div>
      </div>
      
      <div class="form-group">
        <label>CONFIRM PASSWORD</label>
        <input id="confirmPassword" type="password" placeholder="Confirm new password" required oninput="validatePassword()">
        <div class="status-icon"></div>
      </div>
      
      <div class="password-requirements">
        <h4>PASSWORD REQUIREMENTS:</h4>
        <ul>
          <li id="req-length">At least 8 characters</li>
          <li id="req-upper">One uppercase letter</li>
          <li id="req-lower">One lowercase letter</li>
          <li id="req-number">One number</li>
          <li id="req-match">Passwords match</li>
        </ul>
      </div>
      
      <button type="submit" class="btn-reset" id="submitBtn" disabled>
        <span>RESET PASSWORD</span>
      </button>
    </form>
    
    <div class="links">
      <a href="login.html">BACK TO LOGIN</a>
    </div>
    
    <div id="msg" class="message"></div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/js/immersive.js"></script>
  <script>
    // Three.js Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    camera.position.z = 5;
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 15;
      posArray[i + 1] = (Math.random() - 0.5) * 15;
      posArray[i + 2] = (Math.random() - 0.5) * 15;
      
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() * 0.5 + 0.5;
      colorArray[i + 2] = Math.random() * 0.5 + 0.5;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.015,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      
      particlesMesh.rotation.x += 0.0003;
      particlesMesh.rotation.y += 0.0005;
      
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Password Validation
    function validatePassword() {
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      
      const hasLength = password.length >= 8;
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const passwordsMatch = password === confirm && password.length > 0;
      
      document.getElementById('req-length').classList.toggle('valid', hasLength);
      document.getElementById('req-upper').classList.toggle('valid', hasUpper);
      document.getElementById('req-lower').classList.toggle('valid', hasLower);
      document.getElementById('req-number').classList.toggle('valid', hasNumber);
      document.getElementById('req-match').classList.toggle('valid', passwordsMatch);
      
      const allValid = hasLength && hasUpper && hasLower && hasNumber && passwordsMatch;
      document.getElementById('submitBtn').disabled = !allValid;
    }
    
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    const msg = document.getElementById('msg');
    
    async function handleReset(e) {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      
      if (password !== confirm) {
        showMessage('PASSWORDS DO NOT MATCH', 'error');
        return;
      }
      
      if (!token) {
        showMessage('INVALID RESET TOKEN', 'error');
        return;
      }
      
      try {
        const res = await fetch('https://lifedot.onrender.com/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        
        if (data.success) {
          showMessage('PASSWORD RESET SUCCESSFUL', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage(data.error || 'RESET FAILED', 'error');
        }
      } catch (error) {
        showMessage('UNABLE TO CONNECT', 'error');
      }
    }
    
    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      
      setTimeout(() => {
        msg.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
