<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset Password — LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow: hidden;
    }

    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: rgba(0, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
      mix-blend-mode: screen;
    }
    
    .cursor-ring {
      position: fixed;
      width: 35px;
      height: 35px;
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      mix-blend-mode: screen;
    }

    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* BACK BUTTON */
    .back-link {
      position: fixed;
      top: 40px;
      left: 60px;
      padding: 14px 40px;
      background: rgba(15, 25, 45, 0.7);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 35px;
      font-size: 11px;
      letter-spacing: 3px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.9);
      transition: all 0.4s ease;
      backdrop-filter: blur(15px);
      font-weight: 400;
      z-index: 100;
      text-transform: uppercase;
    }

    .back-link:hover {
      background: rgba(0, 255, 255, 0.15);
      border-color: rgba(0, 255, 255, 0.8);
      color: #fff;
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
    }

    /* CONTAINER */
    .reset-container {
      background: rgba(15, 25, 45, 0.5);
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 30px;
      max-width: 520px;
      width: 100%;
      padding: 85px 65px;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(25px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 255, 255, 0.1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reset-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, rgba(0, 255, 255, 0.12) 0%, transparent 70%);
      border-radius: 30px;
      pointer-events: none;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 65px;
      position: relative;
    }

    .header-icon {
      font-size: 60px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.5));
    }

    .header h2 {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      background: linear-gradient(180deg, #fff 0%, rgba(0, 255, 255, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: rgba(0, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 4px;
      font-weight: 300;
      text-transform: uppercase;
    }

    /* FORM */
    .input-group {
      margin-bottom: 45px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(0, 255, 255, 0.8);
      margin-bottom: 18px;
      font-weight: 400;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 20px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(0, 255, 255, 0.3);
      color: #fff;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
      font-weight: 300;
    }

    .input-group input:focus {
      border-color: rgba(0, 255, 255, 0.8);
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* BUTTON */
    .btn-reset {
      width: 100%;
      padding: 22px;
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 35px;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      cursor: none;
      transition: all 0.4s ease;
      margin-top: 25px;
      letter-spacing: 3px;
      backdrop-filter: blur(15px);
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }

    .btn-reset:hover {
      background: rgba(0, 255, 255, 0.3);
      border-color: rgba(0, 255, 255, 0.9);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
      transform: translateY(-3px);
    }

    /* LINKS */
    .links {
      text-align: center;
      margin-top: 35px;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .links a {
      color: rgba(0, 255, 255, 0.9);
      text-decoration: none;
      transition: color 0.3s ease;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }

    .links a:hover {
      color: #fff;
      text-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
    }

    /* MESSAGE */
    .message {
      margin-top: 30px;
      padding: 20px;
      font-weight: 300;
      font-size: 12px;
      text-align: center;
      display: none;
      letter-spacing: 2px;
      border-radius: 25px;
      animation: slideDown 0.3s ease;
      text-transform: uppercase;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.success {
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      color: #fff;
    }

    .message.error {
      background: rgba(255, 0, 100, 0.2);
      border: 2px solid rgba(255, 0, 100, 0.5);
      color: #ff0064;
    }

    /* INFO BOX */
    .info-box {
      margin-top: 35px;
      padding: 25px;
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 20px;
      border-left: 3px solid rgba(0, 255, 255, 0.5);
    }

    .info-box p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      line-height: 1.8;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .reset-container { padding: 65px 45px; }
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
      .back-link { left: 20px; top: 20px; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <canvas id="canvas3d"></canvas>
  
  <a href="login.html" class="back-link">← Back to Login</a>

  <div class="reset-container">
    <div class="header">
      <div class="header-icon">🔐</div>
      <h2>Reset Password</h2>
      <p class="subtitle">Create a new password</p>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label>New Password</label>
      <input id="newPassword" type="password" placeholder="Min. 8 characters" required>
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Re-enter password" required>
    </div>

    <button class="btn-reset" onclick="handleReset()">Reset Password</button>

    <div class="links">
      <a href="login.html">Remember your password? Sign in</a>
    </div>

    <div id="message" class="message"></div>

    <div class="info-box">
      <p>💡 Your password must be at least 8 characters long and contain a mix of letters and numbers for security.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cursor
    const cursor = document.querySelector('.cursor');
    const cursorRing = document.querySelector('.cursor-ring');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX, ringY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // Three.js
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.04);
    camera.position.set(0, 5, 15);
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2500;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 60;
      posArray[i + 1] = (Math.random() - 0.5) * 60;
      posArray[i + 2] = (Math.random() - 0.5) * 60;
      
      const colorChoice = Math.random();
      if (colorChoice < 0.5) {
        colorArray[i] = 0;
        colorArray[i + 1] = 1;
        colorArray[i + 2] = 1;
      } else {
        colorArray[i] = 0.3;
        colorArray[i + 1] = 0;
        colorArray[i + 2] = 1;
      }
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    }));
    scene.add(particlesMesh);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0x0a2e4a, 0.6);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0x00ffff, 1.2, 100);
    pointLight.position.set(12, 12, 12);
    scene.add(pointLight);
    
    // Animation
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.y += 0.0006;
      particlesMesh.rotation.x += 0.0003;
      camera.position.x += (targetX * 2.5 - camera.position.x) * 0.05;
      camera.position.y += (targetY * 2.5 - camera.position.y + 5) * 0.05;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Reset Password
    async function handleReset() {
      const email = document.getElementById('email').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!email || !newPassword || !confirmPassword) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      if (newPassword.length < 8) {
        showMessage('Password must be at least 8 characters', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, new_password: newPassword })
        });
        const data = await res.json();

        if (data.success) {
          showMessage('✅ Password reset successful!', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage(data.error || 'Reset failed', 'error');
        }
      } catch (error) {
        showMessage('Unable to connect to server', 'error');
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      
      if (type === 'success') {
        setTimeout(() => msg.style.display = 'none', 5000);
      }
    }

    // Enter key support
    document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleReset();
    });
  </script>
</body>
</html>
