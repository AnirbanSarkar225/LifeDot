<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login — LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow: hidden;
    }

    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      mix-blend-mode: difference;
    }
    
    .cursor-follower {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10001;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }
    
    .cursor.hover {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.05);
    }

    /* GRID BACKGROUND */
    #gridCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
    }

    /* CONTAINER */
    .login-container {
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.05);
      max-width: 500px;
      width: 100%;
      padding: 80px 60px;
      position: relative;
      z-index: 10;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.3), transparent);
    }

    /* BACK LINK */
    .back-link {
      position: absolute;
      top: 30px;
      left: 30px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 10px;
      transition: color 0.3s ease;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .back-link:hover {
      color: rgba(255,255,255,0.8);
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header h2 {
      font-size: 32px;
      font-weight: 200;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 300;
    }

    /* FORM */
    .input-group {
      margin-bottom: 35px;
    }

    .input-group label {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 12px;
      font-weight: 300;
    }

    .input-group input {
      width: 100%;
      padding: 18px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
      font-weight: 300;
    }

    .input-group input:focus {
      border-color: rgba(255,255,255,0.3);
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    /* BUTTON */
    .btn-login {
      width: 100%;
      padding: 20px;
      background: #fff;
      color: #000;
      border: none;
      font-size: 11px;
      font-weight: 300;
      cursor: none;
      transition: all 0.3s ease;
      margin-top: 20px;
      letter-spacing: 2px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    }

    .btn-login:hover {
      background: rgba(255,255,255,0.9);
      transform: translateY(-3px);
    }

    /* LINKS */
    .links {
      text-align: center;
      margin-top: 30px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .links a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #fff;
    }

    .divider {
      text-align: center;
      color: rgba(255,255,255,0.3);
      margin: 40px 0;
      font-size: 10px;
      position: relative;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 35%;
      height: 1px;
      background: rgba(255,255,255,0.05);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 60px;
      max-width: 450px;
      width: 90%;
      animation: modalSlide 0.3s ease;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.3), transparent);
    }

    .modal-content h3 {
      font-size: 24px;
      font-weight: 200;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .modal-content p {
      color: rgba(255,255,255,0.4);
      margin-bottom: 40px;
      font-size: 12px;
      line-height: 1.8;
      font-weight: 300;
    }

    .modal-buttons {
      display: flex;
      gap: 15px;
      margin-top: 40px;
    }

    .btn-secondary {
      flex: 1;
      padding: 18px;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      font-weight: 300;
      cursor: none;
      transition: all 0.3s ease;
      letter-spacing: 2px;
      font-size: 11px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255,255,255,0.3);
    }

    /* TOAST */
    .toast {
      visibility: hidden;
      min-width: 300px;
      background: #fff;
      color: #000;
      text-align: center;
      padding: 20px 30px;
      position: fixed;
      z-index: 3000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 300;
      opacity: 0;
      transition: all 0.3s ease;
      letter-spacing: 2px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }

    .toast.error {
      background: rgba(255,0,0,0.1);
      color: #ff0000;
      border: 1px solid rgba(255,0,0,0.3);
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .login-container { padding: 60px 40px; }
      body { cursor: auto; }
      .cursor, .cursor-follower { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>
  <canvas id="gridCanvas"></canvas>

  <div class="login-container">
    <a href="index.html" class="back-link">← BACK</a>
    
    <div class="header">
      <h2>Welcome Back</h2>
      <p class="subtitle">SIGN IN TO CONTINUE</p>
    </div>

    <div class="input-group">
      <label>EMAIL ADDRESS</label>
      <input id="loginEmail" type="email" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label>PASSWORD</label>
      <input id="loginPassword" type="password" placeholder="••••••••" required>
    </div>

    <button class="btn-login" onclick="handleLogin()">SIGN IN</button>

    <div class="links">
      <a href="#" id="forgotLink">Forgot Password?</a>
    </div>

    <div class="divider">OR</div>

    <div class="links">
      <a href="register.html">Create Account →</a>
    </div>
  </div>

  <div id="forgotModal" class="modal">
    <div class="modal-content">
      <h3>Reset Password</h3>
      <p>Enter your email and we'll send you a link to reset your password.</p>
      <div class="input-group">
        <input type="email" id="resetEmail" placeholder="your@email.com" required>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
        <button class="btn-login" onclick="sendResetLink()" style="margin-top: 0;">SEND LINK</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Custom Cursor
    const cursor = document.querySelector('.cursor');
    const cursorFollower = document.querySelector('.cursor-follower');
    
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let followerX = mouseX;
    let followerY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateFollower() {
      followerX += (mouseX - followerX) * 0.1;
      followerY += (mouseY - followerY) * 0.1;
      
      cursorFollower.style.left = followerX + 'px';
      cursorFollower.style.top = followerY + 'px';
      
      requestAnimationFrame(animateFollower);
    }
    animateFollower();
    
    // Hover effect
    document.querySelectorAll('a, button, input').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });

    // Three.js Grid
    const canvas = document.getElementById('gridCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    camera.position.z = 5;
    camera.position.y = 2;
    camera.rotation.x = -0.3;
    
    const gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0xffffff);
    gridHelper.material.opacity = 0.05;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);
    
    function animate() {
      requestAnimationFrame(animate);
      gridHelper.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Modal
    const modal = document.getElementById('forgotModal');
    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      modal.style.display = 'flex';
    });

    function closeModal() {
      modal.style.display = 'none';
    }

    window.onclick = (event) => {
      if (event.target === modal) closeModal();
    };

    // Login
    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please fill in all fields', true);
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.user) {
          localStorage.setItem("lifedot_user", data.user.name);
          localStorage.setItem("lifedot_user_id", data.user.id);
          localStorage.setItem("lifedot_user_email", data.user.email);
          showToast('Login successful');
          setTimeout(() => window.location.href = "welcome.html", 1000);
        } else {
          showToast('Invalid credentials', true);
        }
      } catch (error) {
        showToast('Unable to connect', true);
      }
    }

    async function sendResetLink() {
      const email = document.getElementById('resetEmail').value;
      if (!email) {
        showToast('Enter email address', true);
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          showToast('Reset link sent');
          closeModal();
          document.getElementById('resetEmail').value = '';
        } else {
          showToast('Email not found', true);
        }
      } catch (error) {
        showToast('Unable to send link', true);
      }
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.className = 'toast', 3000);
    }

    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginEmail').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
