<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login — LifeDot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: none;
      overflow: hidden;
    }

    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      mix-blend-mode: screen;
    }
    
    .cursor-ring {
      position: fixed;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      mix-blend-mode: screen;
    }

    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* BACK BUTTON */
    .back-link {
      position: fixed;
      top: 40px;
      left: 50px;
      padding: 12px 35px;
      background: rgba(20, 30, 50, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 30px;
      font-size: 11px;
      letter-spacing: 3px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      transition: all 0.4s ease;
      backdrop-filter: blur(10px);
      font-weight: 300;
      z-index: 100;
    }

    .back-link:hover {
      background: rgba(0, 255, 255, 0.1);
      border-color: rgba(0, 255, 255, 0.6);
      color: #fff;
    }

    /* CONTAINER */
    .login-container {
      background: rgba(20, 30, 50, 0.4);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 30px;
      max-width: 500px;
      width: 100%;
      padding: 80px 60px;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(20px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
      border-radius: 30px;
      pointer-events: none;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header h2 {
      font-size: 36px;
      font-weight: 200;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 300;
    }

    /* FORM */
    .input-group {
      margin-bottom: 40px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(0, 255, 255, 0.6);
      margin-bottom: 15px;
      font-weight: 300;
    }

    .input-group input {
      width: 100%;
      padding: 18px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(0, 255, 255, 0.2);
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
      font-weight: 300;
    }

    .input-group input:focus {
      border-color: rgba(0, 255, 255, 0.6);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    /* BUTTON */
    .btn-login {
      width: 100%;
      padding: 20px;
      background: rgba(0, 255, 255, 0.15);
      border: 1px solid rgba(0, 255, 255, 0.4);
      border-radius: 30px;
      color: #fff;
      font-size: 11px;
      font-weight: 300;
      cursor: none;
      transition: all 0.4s ease;
      margin-top: 20px;
      letter-spacing: 3px;
      backdrop-filter: blur(10px);
    }

    .btn-login:hover {
      background: rgba(0, 255, 255, 0.25);
      border-color: rgba(0, 255, 255, 0.8);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    /* LINKS */
    .links {
      text-align: center;
      margin-top: 30px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .links a {
      color: rgba(0, 255, 255, 0.8);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #fff;
    }

    .divider {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      margin: 40px 0;
      font-size: 10px;
      position: relative;
      letter-spacing: 3px;
      font-weight: 300;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 35%;
      height: 1px;
      background: rgba(0, 255, 255, 0.1);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: rgba(20, 30, 50, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 30px;
      padding: 60px;
      max-width: 450px;
      width: 90%;
      backdrop-filter: blur(20px);
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-content h3 {
      font-size: 28px;
      font-weight: 200;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .modal-content p {
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 40px;
      font-size: 12px;
      line-height: 1.8;
      font-weight: 300;
    }

    .modal-buttons {
      display: flex;
      gap: 15px;
      margin-top: 40px;
    }

    .btn-secondary {
      flex: 1;
      padding: 18px;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      font-weight: 300;
      cursor: none;
      transition: all 0.3s ease;
      letter-spacing: 2px;
      font-size: 11px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* TOAST */
    .toast {
      visibility: hidden;
      min-width: 300px;
      background: rgba(0, 255, 255, 0.2);
      color: #fff;
      text-align: center;
      padding: 20px 30px;
      position: fixed;
      z-index: 3000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 300;
      opacity: 0;
      transition: all 0.3s ease;
      letter-spacing: 2px;
      border: 1px solid rgba(0, 255, 255, 0.4);
      border-radius: 30px;
      backdrop-filter: blur(20px);
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }

    .toast.error {
      background: rgba(255, 0, 100, 0.2);
      border-color: rgba(255, 0, 100, 0.4);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .login-container { padding: 60px 40px; }
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
      .back-link { left: 20px; top: 20px; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <canvas id="canvas3d"></canvas>
  
  <a href="index.html" class="back-link">← BACK</a>

  <div class="login-container">
    <div class="header">
      <h2>Welcome Back</h2>
      <p class="subtitle">SIGN IN TO CONTINUE</p>
    </div>

    <div class="input-group">
      <label>EMAIL ADDRESS</label>
      <input id="loginEmail" type="email" placeholder="your@email.com" required>
    </div>

    <div class="input-group">
      <label>PASSWORD</label>
      <input id="loginPassword" type="password" placeholder="••••••••" required>
    </div>

    <button class="btn-login" onclick="handleLogin()">SIGN IN</button>

    <div class="links">
      <a href="#" id="forgotLink">Forgot Password?</a>
    </div>

    <div class="divider">OR</div>

    <div class="links">
      <a href="register.html">Create Account →</a>
    </div>
  </div>

  <div id="forgotModal" class="modal">
    <div class="modal-content">
      <h3>Reset Password</h3>
      <p>Enter your email and we'll send you a link to reset your password.</p>
      <div class="input-group">
        <input type="email" id="resetEmail" placeholder="your@email.com" required>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
        <button class="btn-login" onclick="sendResetLink()" style="margin-top: 0;">SEND LINK</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cursor
    const cursor = document.querySelector('.cursor');
    const cursorRing = document.querySelector('.cursor-ring');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX, ringY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function animateRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // Three.js
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.05);
    camera.position.set(0, 5, 15);
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 50;
      posArray[i + 1] = (Math.random() - 0.5) * 50;
      posArray[i + 2] = (Math.random() - 0.5) * 50;
      
      const colorChoice = Math.random();
      if (colorChoice < 0.5) {
        colorArray[i] = 0;
        colorArray[i + 1] = 1;
        colorArray[i + 2] = 1;
      } else {
        colorArray[i] = 0.3;
        colorArray[i + 1] = 0;
        colorArray[i + 2] = 1;
      }
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.05,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0x0a2e4a, 0.5);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0x00ffff, 1, 100);
    pointLight.position.set(10, 10, 10);
    scene.add(pointLight);
    
    // Animation
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.y += 0.0005;
      particlesMesh.rotation.x += 0.0002;
      camera.position.x += (targetX * 2 - camera.position.x) * 0.05;
      camera.position.y += (targetY * 2 - camera.position.y + 5) * 0.05;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Modal
    const modal = document.getElementById('forgotModal');
    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      modal.style.display = 'flex';
    });

    function closeModal() {
      modal.style.display = 'none';
    }

    window.onclick = (event) => {
      if (event.target === modal) closeModal();
    };

    // Login
    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please fill in all fields', true);
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.user) {
          localStorage.setItem("lifedot_user", data.user.name);
          localStorage.setItem("lifedot_user_id", data.user.id);
          localStorage.setItem("lifedot_user_email", data.user.email);
          showToast('Login successful');
          setTimeout(() => window.location.href = "welcome.html", 1000);
        } else {
          showToast('Invalid credentials', true);
        }
      } catch (error) {
        showToast('Unable to connect', true);
      }
    }

    async function sendResetLink() {
      const email = document.getElementById('resetEmail').value;
      if (!email) {
        showToast('Enter email address', true);
        return;
      }

      try {
        const res = await fetch('https://lifedot.onrender.com/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          showToast('Reset link sent');
          closeModal();
          document.getElementById('resetEmail').value = '';
        } else {
          showToast('Email not found', true);
        }
      } catch (error) {
        showToast('Unable to send link', true);
      }
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.className = 'toast', 3000);
    }

    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginEmail').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
