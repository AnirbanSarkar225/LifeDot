<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN — LIFEDOT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      overflow: hidden;
    }
    
    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.1s ease;
      mix-blend-mode: difference;
    }
    
    /* 3D SCENE */
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    /* BACK LINK */
    .back-link {
      position: fixed;
      top: 40px;
      left: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #00ffff;
      text-decoration: none;
      z-index: 100;
      opacity: 0.7;
      transition: all 0.3s;
      mix-blend-mode: difference;
    }
    
    .back-link:hover {
      opacity: 1;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    /* LOGIN CONTAINER */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      padding: 60px 50px;
      background: rgba(0, 30, 40, 0.3);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
      animation: slideIn 0.8s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .header h1 {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
    
    .header p {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.6;
    }
    
    /* FORM */
    .form-group {
      margin-bottom: 30px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #00ffff;
      opacity: 0.7;
    }
    
    .form-group input {
      width: 100%;
      padding: 15px;
      background: rgba(0, 255, 255, 0.03);
      border: none;
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }
    
    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    .form-group input:focus {
      background: rgba(0, 255, 255, 0.05);
      border-bottom-color: #00ffff;
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.1);
    }
    
    /* STATUS ICON */
    .status-icon {
      position: absolute;
      right: 15px;
      top: 38px;
      width: 20px;
      height: 20px;
      border: 2px solid #00ffff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .form-group input:focus ~ .status-icon {
      opacity: 0.5;
    }
    
    /* BUTTON */
    .btn-login {
      width: 100%;
      padding: 18px;
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #00ffff;
      color: #00ffff;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: none;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }
    
    .btn-login::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: #00ffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }
    
    .btn-login:hover::before {
      width: 500px;
      height: 500px;
    }
    
    .btn-login:hover {
      color: #000;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
    }
    
    .btn-login span {
      position: relative;
      z-index: 1;
    }
    
    /* LINKS */
    .links {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
    }
    
    .links a {
      color: #00ffff;
      text-decoration: none;
      opacity: 0.7;
      transition: all 0.3s;
      letter-spacing: 1px;
    }
    
    .links a:hover {
      opacity: 1;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    .divider {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      margin: 40px 0;
      font-size: 11px;
      position: relative;
      letter-spacing: 2px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: rgba(0, 255, 255, 0.2);
    }
    
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    
    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: rgba(0, 30, 40, 0.5);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 50px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 60px rgba(0, 255, 255, 0.2);
    }
    
    .modal-content h3 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 10px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
    
    .modal-content p {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 30px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .modal-buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    .btn-secondary {
      flex: 1;
      padding: 15px;
      background: transparent;
      color: #00ffff;
      border: 1px solid rgba(0, 255, 255, 0.3);
      font-weight: 600;
      cursor: none;
      transition: all 0.3s;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }
    
    .btn-secondary:hover {
      background: rgba(0, 255, 255, 0.1);
      border-color: #00ffff;
    }
    
    /* TOAST */
    .toast {
      visibility: hidden;
      min-width: 300px;
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #00ffff;
      color: #00ffff;
      text-align: center;
      padding: 20px;
      position: fixed;
      z-index: 3000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
    }
    
    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
    
    .toast.error {
      background: rgba(255, 0, 100, 0.1);
      border-color: #ff0064;
      color: #ff0064;
      box-shadow: 0 0 30px rgba(255, 0, 100, 0.3);
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor { display: none; }
      .login-container { padding: 40px 30px; margin: 20px; }
      .back-link { left: 20px; top: 20px; }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  
  <!-- 3D Scene -->
  <canvas id="scene"></canvas>
  
  <!-- Back Link -->
  <a href="index.html" class="back-link">← BACK</a>
  
  <!-- Login Container -->
  <div class="login-container">
    <div class="header">
      <h1>WELCOME BACK</h1>
      <p>SIGN IN TO CONTINUE</p>
    </div>
    
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input id="loginEmail" type="email" placeholder="your@email.com" required>
        <div class="status-icon"></div>
      </div>
      
      <div class="form-group">
        <label>PASSWORD</label>
        <input id="loginPassword" type="password" placeholder="••••••••" required>
        <div class="status-icon"></div>
      </div>
      
      <button type="submit" class="btn-login">
        <span>SIGN IN</span>
      </button>
    </form>
    
    <div class="links">
      <a href="#" id="forgotLink">FORGOT PASSWORD?</a>
    </div>
    
    <div class="divider">OR</div>
    
    <div class="links">
      <a href="register.html">CREATE ACCOUNT →</a>
    </div>
  </div>
  
  <!-- Modal -->
  <div id="forgotModal" class="modal">
    <div class="modal-content">
      <h3>RESET PASSWORD</h3>
      <p>Enter your email and we'll send you a link to reset your password.</p>
      <div class="form-group">
        <input type="email" id="resetEmail" placeholder="your@email.com" required>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
        <button class="btn-login" onclick="sendResetLink()">
          <span>SEND LINK</span>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Toast -->
  <div id="toast" class="toast"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Custom Cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    
    // Three.js Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    camera.position.z = 5;
    
    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 15;
      posArray[i + 1] = (Math.random() - 0.5) * 15;
      posArray[i + 2] = (Math.random() - 0.5) * 15;
      
      colorArray[i] = 0;
      colorArray[i + 1] = Math.random() * 0.5 + 0.5;
      colorArray[i + 2] = Math.random() * 0.5 + 0.5;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.015,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    function animate() {
      requestAnimationFrame(animate);
      
      particlesMesh.rotation.x += 0.0003;
      particlesMesh.rotation.y += 0.0005;
      
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Modal
    const forgotLink = document.getElementById('forgotLink');
    const modal = document.getElementById('forgotModal');
    const toast = document.getElementById('toast');
    
    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      modal.style.display = 'flex';
    });
    
    function closeModal() {
      modal.style.display = 'none';
    }
    
    window.onclick = (event) => {
      if (event.target === modal) {
        closeModal();
      }
    };
    
    // Login
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      if (!email || !password) {
        showToast('PLEASE FILL IN ALL FIELDS', true);
        return;
      }
      
      try {
        const res = await fetch('https://lifedot.onrender.com/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success && data.user) {
          localStorage.setItem("lifedot_user", data.user.name);
          localStorage.setItem("lifedot_user_id", data.user.id);
          localStorage.setItem("lifedot_user_email", data.user.email);
          showToast('LOGIN SUCCESSFUL');
          setTimeout(() => {
            window.location.href = "welcome.html";
          }, 1000);
        } else {
          showToast('INVALID CREDENTIALS', true);
        }
      } catch (error) {
        showToast('UNABLE TO CONNECT', true);
      }
    }
    
    async function sendResetLink() {
      const email = document.getElementById('resetEmail').value;
      
      if (!email) {
        showToast('ENTER EMAIL ADDRESS', true);
        return;
      }
      
      try {
        const res = await fetch('https://lifedot.onrender.com/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (data.success) {
          showToast('RESET LINK SENT');
          closeModal();
          document.getElementById('resetEmail').value = '';
        } else {
          showToast('EMAIL NOT FOUND', true);
        }
      } catch (error) {
        showToast('UNABLE TO SEND LINK', true);
      }
    }
    
    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => {
        toast.className = 'toast';
      }, 3000);
    }
    
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin(e);
    });
    
    document.getElementById('loginEmail').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginPassword').focus();
    });
  </script>
</body>
</html>
